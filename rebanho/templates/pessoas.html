{% extends "base.html" %}
{% block title %}Clientes e Fornecedores — Fazenda Ipanema{% endblock %}
{% block page_title %}Clientes e Fornecedores{% endblock %}

{% block content %}
<style>
  .lbl{display:block;font-size:10.5px;font-weight:600;color:#888;text-transform:uppercase;letter-spacing:.4px;margin-bottom:4px}
  .inp{width:100%;border:0.5px solid #e8e8e8;border-radius:7px;padding:7px 10px;font-size:12.5px;box-sizing:border-box;font-family:inherit}
  .inp:focus{outline:none;border-color:#4caf50;box-shadow:0 0 0 3px rgba(76,175,80,.1)}
  .sel{background:#fff}
  .tab-btn{padding:8px 22px;border:none;border-bottom:2px solid transparent;background:none;cursor:pointer;font-size:12.5px;font-weight:500;color:#888;font-family:inherit;transition:all .15s}
  .tab-btn:hover{color:#1a1a1a}
  .tab-btn.ativo{color:#0a2e0a;border-bottom-color:#2e7d32;font-weight:600}
</style>

<!-- Abas -->
<div x-data style="background:#fff;border-radius:10px 10px 0 0;padding:0 20px;border-bottom:1px solid #e5e7eb;margin-bottom:0;">
  <button id="tabCliBtn" onclick="mudarAba('CLIENTE')"
          :class="$store.pessoaAba==='CLIENTE' ? 'tab-btn ativo' : 'tab-btn'">👤 Clientes</button>
  <button id="tabForBtn" onclick="mudarAba('FORNECEDOR')"
          :class="$store.pessoaAba==='FORNECEDOR' ? 'tab-btn ativo' : 'tab-btn'">🏪 Fornecedores</button>
</div>

<div style="background:#fff;border-radius:0 0 10px 10px;padding:16px 20px;box-shadow:0 1px 4px rgba(0,0,0,.07);">
  <div style="display:flex;justify-content:flex-end;margin-bottom:12px;">
    <button id="btnNovoPessoa" onclick="abrirModalPessoa()" style="background:#2E7D32;color:#fff;border:none;border-radius:6px;padding:7px 16px;cursor:pointer;font-size:13px;">➕ Novo Cadastro</button>
  </div>
  <div style="overflow-x:auto;">
    <table style="width:100%;border-collapse:collapse;font-size:13px;">
      <thead>
        <tr style="background:#F1F8E9;color:#33691e;">
          <th style="padding:10px 12px;text-align:left;border-bottom:2px solid #C8E6C9;">Código</th>
          <th style="padding:10px 12px;text-align:left;border-bottom:2px solid #C8E6C9;">Tipo</th>
          <th style="padding:10px 12px;text-align:left;border-bottom:2px solid #C8E6C9;">DOC</th>
          <th style="padding:10px 12px;text-align:left;border-bottom:2px solid #C8E6C9;">Nome</th>
          <th style="padding:10px 12px;text-align:left;border-bottom:2px solid #C8E6C9;">Cidade/UF</th>
          <th style="padding:10px 12px;text-align:left;border-bottom:2px solid #C8E6C9;">Telefone</th>
          <th style="padding:10px 12px;text-align:left;border-bottom:2px solid #C8E6C9;">Celular</th>
          <th style="padding:10px 12px;text-align:center;border-bottom:2px solid #C8E6C9;">Ações</th>
        </tr>
      </thead>
      <tbody id="tbodyPessoas"></tbody>
    </table>
  </div>
</div>

<!-- Modal -->
<div id="modalPessoa"
     x-data="{ aberto: false }" x-cloak
     x-show="aberto" x-transition:enter="transition ease-out duration-200"
     x-transition:enter-start="opacity-0 scale-95" x-transition:enter-end="opacity-100 scale-100"
     x-transition:leave="transition ease-in duration-150" x-transition:leave-end="opacity-0"
     @click.self="aberto=false"
     style="position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:200;display:flex;align-items:center;justify-content:center;overflow-y:auto;padding:20px;">
  <div style="background:#fff;border-radius:12px;width:100%;max-width:640px;max-height:90vh;overflow-y:auto;box-shadow:0 8px 32px rgba(0,0,0,.2);">
    <div style="padding:16px 22px;border-bottom:1px solid #e5e7eb;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;background:#fff;z-index:1;">
      <h2 id="modalPessoaTitulo" style="font-size:15px;font-weight:600;color:#1B5E20;"></h2>
      <button onclick="fecharModalPessoa()" style="background:none;border:none;font-size:20px;cursor:pointer;color:#6b7280;">✕</button>
    </div>
    <form id="formPessoa" onsubmit="salvarPessoa(event)" style="padding:18px 22px;">
      <input type="hidden" id="pessoaEditId" />
      <input type="hidden" id="pessoaTipo" />

      <!-- Código (só edição) -->
      <div id="campoCodigoWrap" style="display:none;margin-bottom:12px;">
        <label class="lbl">CÓDIGO</label>
        <input id="pessoaCodigo" class="inp" disabled style="background:#f9fafb;color:#6b7280;" />
      </div>

      <!-- Tipo pessoa -->
      <div style="margin-bottom:14px;">
        <label class="lbl">TIPO DE PESSOA</label>
        <div style="display:flex;gap:20px;margin-top:6px;">
          <label style="display:flex;align-items:center;gap:6px;cursor:pointer;font-size:13px;">
            <input type="radio" id="rdFisica"    name="tipoPessoa" value="Pessoa Física"   onchange="alternarDoc()" checked />
            Pessoa Física
          </label>
          <label style="display:flex;align-items:center;gap:6px;cursor:pointer;font-size:13px;">
            <input type="radio" id="rdJuridica"  name="tipoPessoa" value="Pessoa Jurídica" onchange="alternarDoc()" />
            Pessoa Jurídica
          </label>
        </div>
      </div>

      <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;">
        <div>
          <label id="lblDoc" class="lbl">CPF</label>
          <input id="pessoaDoc" class="inp" placeholder="000.000.000-00" />
        </div>
        <div><label class="lbl">Nome *</label><input id="pessoaNome" class="inp" required /></div>
        <div style="grid-column:1/-1;"><label class="lbl">Endereço</label><input id="pessoaEnd" class="inp" /></div>
        <div><label class="lbl">Bairro</label><input id="pessoaBairro" class="inp" /></div>
        <div><label class="lbl">Cidade</label><input id="pessoaCidade" class="inp" /></div>
        <div>
          <label class="lbl">UF *</label>
          <select id="pessoaUF" class="inp sel"><option value="">Selecione</option></select>
        </div>
        <div><label class="lbl">CEP</label><input id="pessoaCEP" class="inp" placeholder="00000-000" /></div>
        <div><label class="lbl">Telefone</label><input id="pessoaTel" class="inp" /></div>
        <div><label class="lbl">Celular</label><input id="pessoaCel" class="inp" /></div>
        <div style="grid-column:1/-1;"><label class="lbl">Observações</label><textarea id="pessoaObs" class="inp" rows="2"></textarea></div>
      </div>

      <div style="margin-top:16px;display:flex;justify-content:flex-end;gap:10px;">
        <button type="button" onclick="fecharModalPessoa()" style="background:#e5e7eb;color:#374151;border:none;border-radius:6px;padding:7px 18px;cursor:pointer;font-size:13px;">Cancelar</button>
        <button type="submit" style="background:#1B5E20;color:#fff;border:none;border-radius:6px;padding:7px 18px;cursor:pointer;font-size:13px;">💾 Salvar</button>
      </div>
    </form>
  </div>
</div>

{% endblock %}

{% block scripts %}
<script>
document.addEventListener('alpine:init', () => { Alpine.store('pessoaAba', 'CLIENTE'); });
let abaAtual = 'CLIENTE';
let defsPes  = {};

async function init() {
  defsPes = await fetch('/definicoes').then(r => r.json());
  const selUF = document.getElementById('pessoaUF');
  defsPes.ufs.forEach(uf => {
    const o = document.createElement('option');
    o.value = o.textContent = uf;
    selUF.appendChild(o);
  });
  await carregarPessoas();
}

async function carregarPessoas() {
  const lista = await fetch(`/pessoas?tipo=${abaAtual}`).then(r => r.json());
  renderPessoas(lista);
}

function mudarAba(tipo) {
  abaAtual = tipo;
  if (window.Alpine) Alpine.store('pessoaAba', tipo);
  carregarPessoas();
}

function renderPessoas(lista) {
  const tbody = document.getElementById('tbodyPessoas');
  if (!lista.length) {
    tbody.innerHTML = '<tr><td colspan="8" style="text-align:center;padding:18px;color:#9ca3af;">Nenhum cadastro encontrado.</td></tr>';
    return;
  }
  tbody.innerHTML = lista.map((p, i) => `
    <tr style="background:${i%2===0?'#fff':'#fafafa'};border-bottom:1px solid #f3f4f6;">
      <td style="padding:8px 12px;font-weight:600;color:#1B5E20;">${p.codigo || '—'}</td>
      <td style="padding:8px 12px;">${p.pessoa || '—'}</td>
      <td style="padding:8px 12px;">${p.doc || '—'}</td>
      <td style="padding:8px 12px;font-weight:500;">${p.nome}</td>
      <td style="padding:8px 12px;">${[p.cidade, p.uf].filter(Boolean).join('/') || '—'}</td>
      <td style="padding:8px 12px;">${p.telefone || '—'}</td>
      <td style="padding:8px 12px;">${p.celular || '—'}</td>
      <td style="padding:8px 12px;text-align:center;white-space:nowrap;">
        <button onclick='editarPessoa(${JSON.stringify(p)})' style="background:#e5e7eb;border:none;border-radius:5px;padding:3px 8px;cursor:pointer;font-size:13px;">✏️</button>
        <button onclick="confirmarExclusao('/pessoas/${p.id}', carregarPessoas)" style="background:#fee2e2;border:none;border-radius:5px;padding:3px 8px;cursor:pointer;font-size:13px;">🗑️</button>
      </td>
    </tr>`).join('');
}

function abrirModalPessoa(p) {
  _alpineOpen('modalPessoa', true);
  document.getElementById('modalPessoaTitulo').textContent = p ? 'Editar Cadastro' : 'Novo Cadastro';
  document.getElementById('formPessoa').reset();
  document.getElementById('pessoaEditId').value = '';
  document.getElementById('pessoaTipo').value   = abaAtual;
  document.getElementById('campoCodigoWrap').style.display = 'none';

  if (p) {
    document.getElementById('pessoaEditId').value   = p.id;
    document.getElementById('pessoaTipo').value     = p.tipo;
    document.getElementById('pessoaCodigo').value   = p.codigo || '';
    document.getElementById('campoCodigoWrap').style.display = 'block';
    document.getElementById('pessoaNome').value     = p.nome || '';
    document.getElementById('pessoaDoc').value      = p.doc || '';
    document.getElementById('pessoaEnd').value      = p.endereco || '';
    document.getElementById('pessoaBairro').value   = p.bairro || '';
    document.getElementById('pessoaCidade').value   = p.cidade || '';
    document.getElementById('pessoaUF').value       = p.uf || '';
    document.getElementById('pessoaCEP').value      = p.cep || '';
    document.getElementById('pessoaTel').value      = p.telefone || '';
    document.getElementById('pessoaCel').value      = p.celular || '';
    document.getElementById('pessoaObs').value      = p.obs || '';
    const isPJ = (p.pessoa || '') === 'Pessoa Jurídica';
    document.getElementById(isPJ ? 'rdJuridica' : 'rdFisica').checked = true;
    alternarDoc();
  } else {
    document.getElementById('rdFisica').checked = true;
    alternarDoc();
  }
}

function editarPessoa(p) { abrirModalPessoa(p); }
function fecharModalPessoa() { _alpineOpen('modalPessoa', false); }

function alternarDoc() {
  const isPJ = document.getElementById('rdJuridica').checked;
  document.getElementById('lblDoc').textContent = isPJ ? 'CNPJ' : 'CPF';
  document.getElementById('pessoaDoc').placeholder = isPJ ? '00.000.000/0001-00' : '000.000.000-00';
}

async function salvarPessoa(ev) {
  ev.preventDefault();
  const id   = document.getElementById('pessoaEditId').value;
  const tipo = document.getElementById('pessoaTipo').value;
  const isPJ = document.getElementById('rdJuridica').checked;
  const body = {
    tipo,
    pessoa:   isPJ ? 'Pessoa Jurídica' : 'Pessoa Física',
    doc:      document.getElementById('pessoaDoc').value.trim()    || null,
    nome:     document.getElementById('pessoaNome').value.trim(),
    endereco: document.getElementById('pessoaEnd').value.trim()    || null,
    bairro:   document.getElementById('pessoaBairro').value.trim() || null,
    cidade:   document.getElementById('pessoaCidade').value.trim() || null,
    uf:       document.getElementById('pessoaUF').value            || null,
    cep:      document.getElementById('pessoaCEP').value.trim()    || null,
    telefone: document.getElementById('pessoaTel').value.trim()    || null,
    celular:  document.getElementById('pessoaCel').value.trim()    || null,
    obs:      document.getElementById('pessoaObs').value.trim()    || null,
  };
  const url    = id ? `/pessoas/${id}` : '/pessoas';
  const method = id ? 'PUT' : 'POST';
  const r = await fetch(url, { method, headers:{'Content-Type':'application/json'}, body: JSON.stringify(body) });
  const d = await r.json();
  if (!r.ok) { showToast(d.detail || 'Erro ao salvar.', 'erro'); return; }
  fecharModalPessoa();
  showToast('Cadastro salvo!', 'sucesso');
  await carregarPessoas();
}

document.addEventListener('DOMContentLoaded', init);
</script>
{% endblock %}
