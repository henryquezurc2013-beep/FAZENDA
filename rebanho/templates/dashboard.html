<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Fazenda Ipanema · Gestão de Rebanho</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;450;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
body { font-family: "Inter", system-ui, sans-serif; }
body[data-density="compact"] { font-size: 12px; }
body[data-density="compact"] .card-body { padding: 10px; }
body[data-density="compact"] .content { padding: 14px 18px 32px; }
body[data-density="spacious"] .card-body { padding: 18px; }
body[data-density="spacious"] .content { padding: 28px 32px 48px; }
/* Fazenda Ipanema — cool professional agritech */
:root {
  /* Cool slate/navy system */
  --bg: oklch(0.985 0.004 240);
  --bg-2: oklch(0.975 0.005 240);
  --surface: oklch(1 0 0);
  --surface-2: oklch(0.982 0.004 240);
  --border: oklch(0.92 0.006 245);
  --border-strong: oklch(0.86 0.008 245);
  --ink: oklch(0.22 0.02 250);
  --ink-2: oklch(0.32 0.02 250);
  --muted: oklch(0.52 0.015 245);
  --muted-2: oklch(0.65 0.012 245);
  --accent: oklch(0.48 0.11 235);
  --accent-soft: oklch(0.96 0.02 235);
  --accent-ink: oklch(0.32 0.09 235);

  --navy: oklch(0.24 0.03 250);
  --navy-2: oklch(0.19 0.03 250);
  --navy-ink: oklch(0.92 0.01 240);

  --good: oklch(0.56 0.10 155);
  --good-soft: oklch(0.95 0.03 155);
  --warn: oklch(0.68 0.13 75);
  --warn-soft: oklch(0.96 0.04 80);
  --bad: oklch(0.56 0.17 25);
  --bad-soft: oklch(0.96 0.03 25);

  --radius: 8px;
  --radius-sm: 6px;
  --radius-lg: 12px;

  --shadow-sm: 0 1px 2px oklch(0.22 0.02 250 / 0.04);
  --shadow: 0 1px 3px oklch(0.22 0.02 250 / 0.05), 0 1px 2px oklch(0.22 0.02 250 / 0.03);

  --font-sans: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  font-family: var(--font-sans);
  color: var(--ink);
  background: var(--bg);
  font-size: 13px;
  line-height: 1.45;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
  font-feature-settings: "cv11", "ss01";
}

button { font-family: inherit; color: inherit; cursor: pointer; border: 0; background: none; padding: 0; }
a { color: inherit; text-decoration: none; }

/* Scrollbars */
::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-thumb { background: oklch(0.88 0.008 245); border-radius: 10px; border: 2px solid var(--bg); }
::-webkit-scrollbar-thumb:hover { background: oklch(0.78 0.012 245); }
::-webkit-scrollbar-track { background: transparent; }

/* ================ APP SHELL ================ */
.app {
  display: grid;
  grid-template-columns: 220px 1fr;
  min-height: 100vh;
}

/* Sidebar */
.sidebar {
  background: var(--surface);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  position: sticky;
  top: 0;
  height: 100vh;
  overflow-y: auto;
}
.sidebar-brand {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 16px 16px 14px;
  border-bottom: 1px solid var(--border);
}
.sidebar-brand-mark {
  width: 32px; height: 32px;
  border-radius: 8px;
  background: var(--navy);
  color: white;
  display: grid; place-items: center;
  font-family: var(--font-mono); font-weight: 600; font-size: 14px;
  letter-spacing: -0.02em;
}
.sidebar-brand-name {
  font-weight: 600; font-size: 13px; letter-spacing: -0.005em;
  color: var(--ink);
}
.sidebar-brand-sub {
  font-size: 11px; color: var(--muted);
}

.sidebar-section { padding: 12px 10px 2px; }
.sidebar-section-title {
  font-size: 10px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--muted-2);
  font-weight: 600;
  padding: 0 8px 6px;
}
.sidebar-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 7px 10px;
  border-radius: var(--radius-sm);
  color: var(--ink-2);
  font-size: 13px;
  font-weight: 450;
  position: relative;
  margin: 1px 0;
  width: 100%;
  text-align: left;
}
.sidebar-item:hover { background: var(--bg-2); color: var(--ink); }
.sidebar-item.active {
  background: var(--navy);
  color: white;
}
.sidebar-item.active .sidebar-icon { color: white; opacity: 0.9; }
.sidebar-icon {
  width: 16px; height: 16px;
  display: inline-flex;
  color: var(--muted);
  flex-shrink: 0;
}
.sidebar-badge {
  margin-left: auto;
  font-size: 10px;
  font-weight: 600;
  padding: 1px 6px;
  border-radius: 999px;
  background: var(--bad);
  color: white;
  min-width: 18px; text-align: center;
}
.sidebar-item.active .sidebar-badge { background: white; color: var(--navy); }

.sidebar-footer {
  margin-top: auto;
  padding: 10px;
  border-top: 1px solid var(--border);
}

/* Topbar */
.main { min-width: 0; display: flex; flex-direction: column; }
.topbar {
  height: 52px;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  padding: 0 20px;
  gap: 16px;
  position: sticky; top: 0; z-index: 20;
}
.topbar-title {
  font-size: 13px; font-weight: 500; color: var(--ink);
}
.topbar-sep { color: var(--border-strong); }
.topbar-crumb { color: var(--muted); font-size: 13px; }
.topbar-spacer { flex: 1; }

.topbar-pill {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 4px 10px;
  background: var(--bg-2);
  border: 1px solid var(--border);
  border-radius: 999px;
  font-size: 12px;
  color: var(--ink-2);
}
.topbar-pill .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--good); box-shadow: 0 0 0 3px oklch(0.56 0.10 155 / 0.18); }

.topbar-iconbtn {
  width: 32px; height: 32px;
  display: grid; place-items: center;
  border-radius: 6px;
  color: var(--muted);
}
.topbar-iconbtn:hover { background: var(--bg-2); color: var(--ink); }

.topbar-user {
  display: inline-flex; align-items: center; gap: 8px;
  padding: 3px 10px 3px 3px;
  border-radius: 999px;
  border: 1px solid var(--border);
  background: var(--surface);
}
.avatar {
  width: 26px; height: 26px;
  border-radius: 50%;
  background: var(--accent);
  color: white;
  display: grid; place-items: center;
  font-size: 11px; font-weight: 600;
}

/* Content */
.content {
  padding: 20px 24px 40px;
  max-width: 1480px;
  width: 100%;
  margin: 0 auto;
}

/* ============ PRIMITIVES ============ */
.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
}
.card-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 12px 14px;
  border-bottom: 1px solid var(--border);
}
.card-title {
  font-size: 13px; font-weight: 600; color: var(--ink);
  display: inline-flex; align-items: center; gap: 8px;
}
.card-sub { font-size: 11px; color: var(--muted); font-weight: 400; }
.card-body { padding: 14px; }

.btn {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 6px 10px;
  font-size: 12px; font-weight: 500;
  border-radius: 6px;
  border: 1px solid var(--border);
  background: var(--surface);
  color: var(--ink-2);
  transition: background 120ms, border-color 120ms;
}
.btn:hover { background: var(--bg-2); border-color: var(--border-strong); color: var(--ink); }
.btn-primary {
  background: var(--navy); color: white; border-color: var(--navy);
}
.btn-primary:hover { background: var(--navy-2); border-color: var(--navy-2); color: white; }
.btn-ghost { border-color: transparent; }
.btn-danger { background: var(--bad); color: white; border-color: var(--bad); }

.chip {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 2px 8px;
  font-size: 11px; font-weight: 500;
  border-radius: 999px;
  background: var(--bg-2);
  border: 1px solid var(--border);
  color: var(--ink-2);
}
.chip.good { background: var(--good-soft); border-color: transparent; color: var(--good); }
.chip.warn { background: var(--warn-soft); border-color: transparent; color: var(--warn); }
.chip.bad { background: var(--bad-soft); border-color: transparent; color: var(--bad); }
.chip.accent { background: var(--accent-soft); border-color: transparent; color: var(--accent-ink); }
.chip.dot::before {
  content: ""; width: 5px; height: 5px; border-radius: 50%; background: currentColor;
}

.num { font-family: var(--font-mono); font-feature-settings: "tnum" 1, "zero" 1; letter-spacing: -0.02em; }

.hr { height: 1px; background: var(--border); border: 0; margin: 0; }
.divider-v { width: 1px; background: var(--border); align-self: stretch; }

/* Alert */
.alert {
  display: flex; gap: 12px;
  padding: 12px 14px;
  border-radius: var(--radius);
  border: 1px solid var(--border);
  background: var(--surface);
}
.alert-urgent {
  border-color: oklch(0.88 0.08 25);
  background: linear-gradient(0deg, var(--bad-soft), var(--bad-soft)), var(--surface);
}
.alert-icon {
  width: 28px; height: 28px;
  display: grid; place-items: center;
  border-radius: 8px;
  color: var(--bad);
  background: white;
  flex-shrink: 0;
}
.alert-title {
  font-size: 11px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase;
  color: var(--bad);
}
.alert-body { font-size: 13px; color: var(--ink); margin-top: 2px; }

/* KPI */
.kpi {
  padding: 14px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  position: relative;
  overflow: hidden;
}
.kpi-label {
  font-size: 10.5px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--muted);
  font-weight: 600;
}
.kpi-value {
  font-family: var(--font-mono);
  font-size: 28px;
  font-weight: 500;
  letter-spacing: -0.03em;
  color: var(--ink);
  margin-top: 4px;
  line-height: 1;
  font-feature-settings: "tnum" 1;
}
.kpi-sub { font-size: 11px; color: var(--muted); margin-top: 6px; }
.kpi-accent {
  background: var(--navy); color: white; border-color: var(--navy);
}
.kpi-accent .kpi-label { color: oklch(0.75 0.02 240); }
.kpi-accent .kpi-value { color: white; }
.kpi-accent .kpi-sub { color: oklch(0.78 0.02 240); }

/* Progress */
.progress {
  height: 6px; border-radius: 999px; background: var(--bg-2); overflow: hidden;
}
.progress > span { display: block; height: 100%; background: var(--accent); border-radius: 999px; }

/* Table */
.table {
  width: 100%;
  border-collapse: collapse;
  font-size: 12.5px;
}
.table th {
  text-align: left;
  font-size: 10.5px;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--muted);
  font-weight: 600;
  padding: 10px 14px;
  border-bottom: 1px solid var(--border);
  background: var(--bg-2);
  white-space: nowrap;
}
.table td {
  padding: 10px 14px;
  border-bottom: 1px solid var(--border);
  color: var(--ink-2);
  vertical-align: middle;
}
.table tr:last-child td { border-bottom: 0; }
.table tr:hover td { background: var(--bg-2); }
.table td.num, .table th.num { font-family: var(--font-mono); text-align: right; }

/* Tabs */
.tabs {
  display: flex; gap: 2px;
  border-bottom: 1px solid var(--border);
  padding: 0 14px;
}
.tab {
  padding: 10px 12px;
  font-size: 12.5px;
  color: var(--muted);
  font-weight: 500;
  border-bottom: 2px solid transparent;
  margin-bottom: -1px;
}
.tab:hover { color: var(--ink); }
.tab.active { color: var(--ink); border-bottom-color: var(--navy); }

/* Sparkline frame */
.spark {
  height: 40px; width: 100%; display: block;
}

/* Segmented */
.seg {
  display: inline-flex;
  padding: 2px;
  background: var(--bg-2);
  border: 1px solid var(--border);
  border-radius: 8px;
  font-size: 12px;
}
.seg button {
  padding: 4px 10px;
  border-radius: 6px;
  color: var(--muted);
  font-weight: 500;
}
.seg button.on { background: var(--surface); color: var(--ink); box-shadow: var(--shadow-sm); }

/* Grids */
.grid { display: grid; gap: 14px; }
.g-cols-12 { grid-template-columns: repeat(12, 1fr); }
.g-cols-7 { grid-template-columns: repeat(7, minmax(0, 1fr)); }
.g-cols-4 { grid-template-columns: repeat(4, 1fr); }
.g-cols-3 { grid-template-columns: repeat(3, 1fr); }
.g-cols-2 { grid-template-columns: 1fr 1fr; }
.span-3 { grid-column: span 3; }
.span-4 { grid-column: span 4; }
.span-5 { grid-column: span 5; }
.span-6 { grid-column: span 6; }
.span-7 { grid-column: span 7; }
.span-8 { grid-column: span 8; }
.span-9 { grid-column: span 9; }
.span-12 { grid-column: span 12; }

/* Placeholder surface for visuals */
.placeholder-surface {
  background:
    repeating-linear-gradient(
      135deg,
      oklch(0.94 0.008 245) 0 8px,
      oklch(0.97 0.006 245) 8px 16px
    );
  border: 1px dashed var(--border-strong);
  border-radius: var(--radius);
  display: grid; place-items: center;
  color: var(--muted);
  font-family: var(--font-mono);
  font-size: 11px;
  letter-spacing: 0.04em;
  text-transform: uppercase;
}

/* Modal */
.modal-backdrop {
  position: fixed; inset: 0;
  background: oklch(0.18 0.02 250 / 0.45);
  backdrop-filter: blur(3px);
  z-index: 80;
  display: grid; place-items: center;
  animation: fade 140ms ease;
}
.modal {
  background: var(--surface);
  border-radius: var(--radius-lg);
  width: min(560px, 92vw);
  max-height: 86vh;
  overflow: auto;
  box-shadow: 0 20px 60px oklch(0.15 0.02 250 / 0.2);
  animation: rise 180ms cubic-bezier(.2,.8,.2,1);
}
@keyframes fade { from { opacity: 0; } }
@keyframes rise { from { opacity: 0; transform: translateY(8px); } }

.modal-head {
  padding: 16px 20px; border-bottom: 1px solid var(--border);
  display: flex; justify-content: space-between; align-items: center;
}
.modal-title { font-size: 15px; font-weight: 600; }
.modal-body { padding: 18px 20px; }
.modal-foot {
  padding: 12px 20px; border-top: 1px solid var(--border);
  display: flex; gap: 8px; justify-content: flex-end;
}

.field { display: grid; gap: 5px; margin-bottom: 12px; }
.field label { font-size: 11px; font-weight: 600; color: var(--muted); letter-spacing: 0.04em; text-transform: uppercase; }
.field input, .field select, .field textarea {
  font-family: inherit; font-size: 13px;
  padding: 8px 10px;
  border-radius: 6px;
  border: 1px solid var(--border);
  background: var(--surface);
  color: var(--ink);
  outline: none;
}
.field input:focus, .field select:focus, .field textarea:focus {
  border-color: var(--accent); box-shadow: 0 0 0 3px oklch(0.48 0.11 235 / 0.15);
}
.field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

/* ============ VARIATION: BALANCED ============ */
body[data-variant="balanced"] .kpi-accent { background: var(--navy); }
body[data-variant="balanced"] .card { box-shadow: var(--shadow-sm); }

/* ============ VARIATION: BOLD ============ */
body[data-variant="bold"] {
  --bg: oklch(0.17 0.025 250);
  --bg-2: oklch(0.2 0.025 250);
  --surface: oklch(0.22 0.025 250);
  --surface-2: oklch(0.25 0.025 250);
  --border: oklch(0.3 0.02 250);
  --border-strong: oklch(0.4 0.02 250);
  --ink: oklch(0.96 0.008 240);
  --ink-2: oklch(0.88 0.01 240);
  --muted: oklch(0.66 0.015 245);
  --muted-2: oklch(0.56 0.015 245);
  --accent: oklch(0.78 0.13 80);
  --accent-soft: oklch(0.32 0.08 80);
  --accent-ink: oklch(0.85 0.14 80);
  --navy: oklch(0.92 0.015 240);
  --navy-ink: oklch(0.2 0.025 250);
  --good: oklch(0.82 0.14 155);
  --good-soft: oklch(0.3 0.07 155);
  --warn: oklch(0.85 0.14 75);
  --warn-soft: oklch(0.32 0.1 75);
  --bad: oklch(0.78 0.16 25);
  --bad-soft: oklch(0.32 0.09 25);
  --accent-ink: oklch(0.88 0.14 80);
}
body[data-variant="bold"] .chip.good { color: oklch(0.88 0.14 155); }
body[data-variant="bold"] .chip.warn { color: oklch(0.88 0.14 75); }
body[data-variant="bold"] .chip.bad { color: oklch(0.85 0.16 25); }
body[data-variant="bold"] .sidebar-item.active { background: var(--accent); color: oklch(0.2 0.03 80); }
body[data-variant="bold"] .sidebar-item.active .sidebar-icon { color: oklch(0.2 0.03 80); }
body[data-variant="bold"] .btn-primary { background: var(--accent); color: oklch(0.2 0.03 80); border-color: var(--accent); }
body[data-variant="bold"] .btn-primary:hover { background: oklch(0.85 0.14 80); color: oklch(0.2 0.03 80); border-color: oklch(0.85 0.14 80); }
body[data-variant="bold"] .kpi-accent { background: var(--accent); color: oklch(0.2 0.03 80); border-color: var(--accent); }
body[data-variant="bold"] .kpi-accent .kpi-label { color: oklch(0.25 0.06 80); }
body[data-variant="bold"] .kpi-accent .kpi-value { color: oklch(0.2 0.03 80); }
body[data-variant="bold"] .kpi-accent .kpi-sub { color: oklch(0.3 0.06 80); }
body[data-variant="bold"] .sidebar-brand-mark { background: var(--accent); color: oklch(0.2 0.03 80); }
body[data-variant="bold"] .avatar { background: var(--accent); color: oklch(0.2 0.03 80); }
body[data-variant="bold"] .alert-icon { background: oklch(0.32 0.09 25); }
body[data-variant="bold"] .tab.active { border-bottom-color: var(--accent); }

/* Tweaks panel */
.tweaks-fab {
  position: fixed; bottom: 20px; right: 20px; z-index: 90;
  width: 44px; height: 44px; border-radius: 50%;
  background: var(--navy); color: white;
  display: grid; place-items: center;
  box-shadow: 0 6px 20px oklch(0.15 0.02 250 / 0.25);
}
.tweaks-panel {
  position: fixed; bottom: 76px; right: 20px; z-index: 91;
  width: 280px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  box-shadow: 0 20px 50px oklch(0.15 0.02 250 / 0.15);
  overflow: hidden;
}
.tweaks-panel header {
  padding: 12px 14px; border-bottom: 1px solid var(--border);
  font-weight: 600; font-size: 13px;
}
.tweaks-panel .tw-body { padding: 14px; display: grid; gap: 14px; }
.tw-group-label { font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); font-weight: 600; margin-bottom: 6px; }
.tw-row { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; }
.tw-opt {
  padding: 8px 6px;
  border-radius: 6px;
  border: 1px solid var(--border);
  background: var(--bg-2);
  font-size: 11.5px; font-weight: 500;
  text-align: center;
  color: var(--ink-2);
}
.tw-opt.on { background: var(--navy); color: white; border-color: var(--navy); }

/* ================ MOBILE ================ */
.bottom-nav { display: none; }
@media (max-width: 768px) {
  .app { grid-template-columns: 1fr; }
  .sidebar { display: none; }
  .topbar { padding: 10px 14px; gap: 6px; }
  .topbar-crumb, .topbar-sep, .topbar-pill, .topbar-user > div { display: none; }
  .topbar-spacer { flex: 1; }
  .topbar > button:not(.topbar-iconbtn) { display: none; }
  .content { padding: 12px !important; padding-bottom: 72px !important; }
  .grid.g-cols-12 .span-5, .grid.g-cols-12 .span-7, .grid.g-cols-12 .span-4, .grid.g-cols-12 .span-8, .grid.g-cols-12 .span-6 { grid-column: span 12 !important; }
  .grid.g-cols-2 { grid-template-columns: 1fr !important; }
  .grid.g-cols-4 { grid-template-columns: repeat(2, 1fr) !important; }
  .grid[style*="repeat(8"] { grid-template-columns: repeat(2, 1fr) !important; }
  .tweaks-fab { bottom: 80px; }
  .tweaks-panel { bottom: 136px; right: 12px; left: 12px; width: auto; }

  .bottom-nav {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    position: fixed; bottom: 0; left: 0; right: 0;
    background: var(--surface);
    border-top: 1px solid var(--border);
    z-index: 50;
    padding: 6px 4px 8px;

// Small chart + shared visual primitives
const Spark = ({ values, color = "var(--accent)", height = 40, fill = true }) => {
  if (!values || !values.length) return null;
  const min = Math.min(...values);
  const max = Math.max(...values);
  const range = max - min || 1;
  const W = 100;
  const H = height;
  const step = W / (values.length - 1);
  const pts = values.map((v, i) => [i * step, H - ((v - min) / range) * (H - 4) - 2]);
  const d = pts.map(([x, y], i) => (i ? `L${x.toFixed(2)},${y.toFixed(2)}` : `M${x.toFixed(2)},${y.toFixed(2)}`)).join(" ");
  const dArea = `${d} L${W},${H} L0,${H} Z`;
  return (
    <svg viewBox={`0 0 ${W} ${H}`} preserveAspectRatio="none" className="spark" style={{height}}>
      {fill && <path d={dArea} fill={color} opacity="0.1" />}
      <path d={d} stroke={color} strokeWidth="1.5" fill="none" vectorEffect="non-scaling-stroke" strokeLinecap="round" strokeLinejoin="round" />
    </svg>
  );
};

const Bars = ({ data, labelKey = "m", valueKey = "v", color = "var(--accent)", height = 120, max }) => {
  const vmax = max ?? Math.max(1, ...data.map(d => d[valueKey]));
  return (
    <div style={{display: "grid", gridTemplateColumns: `repeat(${data.length}, 1fr)`, gap: 6, alignItems: "end", height}}>
      {data.map((d, i) => {
        const h = (d[valueKey] / vmax) * (height - 24);
        return (
          <div key={i} style={{display:"flex", flexDirection:"column", alignItems:"center", gap: 4}}>
            <div style={{
              width: "100%", maxWidth: 22, height: Math.max(h, 2),
              background: d[valueKey] === 0 ? "var(--bg-2)" : color,
              borderRadius: 4,
              border: d[valueKey] === 0 ? "1px dashed var(--border-strong)" : "none",
            }} />
            <div style={{fontSize: 10.5, color: "var(--muted)", fontFamily: "var(--font-mono)"}}>{d[labelKey]}</div>
            <div style={{fontSize: 11, color: "var(--ink-2)", fontFamily: "var(--font-mono)", marginTop: -2}}>{d[valueKey]}</div>
          </div>
        );
      })}
    </div>
  );
};

const Donut = ({ segments, size = 120, stroke = 14, centerTop, centerBottom }) => {
  const total = segments.reduce((a, s) => a + s.v, 0) || 1;
  const r = (size - stroke) / 2;
  const c = 2 * Math.PI * r;
  let off = 0;
  return (
    <div style={{position: "relative", width: size, height: size}}>
      <svg width={size} height={size} style={{transform: "rotate(-90deg)"}}>
        <circle cx={size/2} cy={size/2} r={r} fill="none" stroke="var(--border)" strokeWidth={stroke} />
        {segments.map((s, i) => {
          const len = (s.v / total) * c;
          const el = (
            <circle key={i} cx={size/2} cy={size/2} r={r} fill="none"
                    stroke={s.color} strokeWidth={stroke} strokeLinecap="butt"
                    strokeDasharray={`${len} ${c - len}`}
                    strokeDashoffset={-off} />
          );
          off += len;
          return el;
        })}
      </svg>
      <div style={{position:"absolute", inset: 0, display: "grid", placeItems: "center", textAlign: "center"}}>
        <div>
          <div style={{fontFamily: "var(--font-mono)", fontSize: 22, fontWeight: 500, letterSpacing: "-0.03em"}}>{centerTop}</div>
          <div style={{fontSize: 10, color: "var(--muted)", textTransform: "uppercase", letterSpacing: "0.06em"}}>{centerBottom}</div>
        </div>
      </div>
    </div>
  );
};

const Ring = ({ pct, size = 48, stroke = 5, color }) => {
  const r = (size - stroke) / 2;
  const c = 2 * Math.PI * r;
  const dash = (pct/100) * c;
  return (
    <svg width={size} height={size} style={{transform:"rotate(-90deg)"}}>
      <circle cx={size/2} cy={size/2} r={r} fill="none" stroke="var(--border)" strokeWidth={stroke} />
      <circle cx={size/2} cy={size/2} r={r} fill="none" stroke={color || "var(--accent)"} strokeWidth={stroke}
              strokeDasharray={`${dash} ${c - dash}`} strokeLinecap="round" />
    </svg>
  );
};

const Gauge = ({ value, min = 0, max = 2, color = "var(--accent)" }) => {
  const pct = Math.max(0, Math.min(1, (value - min) / (max - min)));
  return (
    <div style={{position: "relative"}}>
      <div style={{height: 6, background: "var(--bg-2)", borderRadius: 999, overflow: "hidden"}}>
        <div style={{width: `${pct*100}%`, height: "100%", background: color, borderRadius: 999, transition: "width 400ms"}} />
      </div>
      <div style={{display: "flex", justifyContent: "space-between", fontSize: 10, fontFamily: "var(--font-mono)", color: "var(--muted)", marginTop: 4}}>
        <span>{min.toFixed(1)}</span>
        <span>{max.toFixed(1)}</span>
      </div>
    </div>
  );
};

function SmartAlerts({ setRoute }) {
  const [dismissed, setDismissed] = useState({});
  const [expanded, setExpanded] = useState({});
  const visible = SMART_ALERTS.filter((_, i) => !dismissed[i]);
  if (visible.length === 0) return null;
  const sevBg = { high: "var(--bad-soft)", med: "var(--warn-soft)", low: "var(--accent-soft)" };
  const sevFg = { high: "var(--bad)", med: "var(--warn)", low: "var(--accent-ink)" };
  return (
    <div className="card" style={{marginBottom: 14}}>
      <div className="card-header">
        <div>
          <div className="card-title"><Icons.Alert size={14} /> Alertas inteligentes</div>
          <div className="card-sub" style={{marginTop: 2}}>detectados automaticamente por padrão de dados</div>
        </div>
        <span className="chip accent dot">{visible.length} ativos</span>
      </div>
      <div style={{padding: 10, display:"grid", gap: 6}}>
        {SMART_ALERTS.map((a, i) => {
          if (dismissed[i]) return null;
          const Icon = Icons[a.icon] || Icons.Alert;
          const isOpen = !!expanded[i];
          return (
            <div key={i} style={{
              padding: "10px 12px", borderRadius: 8,
              background: "var(--bg-2)",
              border: "1px solid var(--border)",
            }}>
              <div style={{display:"flex", alignItems:"center", gap: 12}}>
                <div style={{
                  width: 32, height: 32, borderRadius: 8,
                  background: sevBg[a.severity], color: sevFg[a.severity],
                  display:"grid", placeItems:"center", flexShrink: 0,
                }}><Icon size={16} /></div>
                <div style={{flex: 1, minWidth: 0, display:"flex", alignItems:"center", gap: 8}}>
                  <div style={{fontSize: 13, fontWeight: 500, letterSpacing:"-0.005em"}}>{a.title}</div>
                  <span className="chip" style={{padding:"0 6px", fontSize: 10}}>{a.tag}</span>
                </div>
                <button
                  className="btn btn-ghost"
                  onClick={() => setExpanded(e => ({...e, [i]: !e[i]}))}
                  title={isOpen ? "Recolher" : "Expandir"}
                  style={{transition: "transform 150ms ease", transform: isOpen ? "rotate(180deg)" : "none"}}
                >
                  <Icons.ChevronDown size={14} />
                </button>
              </div>
              {isOpen && (
                <div style={{
                  marginTop: 10, paddingTop: 10, paddingLeft: 44,
                  borderTop: "1px dashed var(--border)",
                  display:"flex", alignItems:"center", gap: 10,
                  animation: "rise 160ms ease",
                }}>

                  <button className="btn" onClick={() => setRoute(a.route)}>Investigar</button>
                  <button className="btn btn-ghost" onClick={() => setDismissed(d => ({...d, [i]: true}))} title="Dispensar"><Icons.Close size={12} /></button>
                </div>
              )}
            </div>
          );
        })}
      </div>
    </div>
  );
}

// ═══ API Client ═══
window.Api = (() => {
  async function req(method, path, body) {
    try {
      const opts = { method, headers: {"Content-Type":"application/json"} };
      if (body) opts.body = JSON.stringify(body);
      const res = await fetch(path, opts);
      if (!res.ok) {
        const err = await res.json().catch(() => ({ detail: res.statusText }));
        console.error("API error", path, err);
        return null;
      }
      return await res.json();
    } catch (e) {
      console.error("API fetch error", e);
      return null;
    }
  }
  return {
    animais:       (p="") => req("GET",    `/animais${p}`),
    criarAnimal:   (b)    => req("POST",   "/animais", b),
    excluirAnimal: (id)   => req("DELETE", `/animais/${id}`),
    pesagens:      (p="") => req("GET",    `/pesagens${p}`),
    criarPesagem:  (b)    => req("POST",   "/pesagens", b),
    sanidade:      (p="") => req("GET",    `/sanidade${p}`),
    criarSanidade: (b)    => req("POST",   "/sanidade", b),
    despesas:      (p="") => req("GET",    `/despesas${p}`),
    criarDespesa:  (b)    => req("POST",   "/despesas", b),
    vendas:        (p="") => req("GET",    `/vendas${p}`),
    compras:       (p="") => req("GET",    `/compras${p}`),
    medicao:       (b)    => req("POST",   "/pastagem/medicao", b),
  };
})();

function _mapAnimal(a) {
  if (a.categoria) return a; // já mapeado
  return {
    id: a.brinco, brinco: a.brinco, nome: a.nome,
    categoria: a.tipo || "—",
    sexo: a.sexo ? (a.sexo.toUpperCase().startsWith("M") ? "M" : "F") : "M",
    nasc: a.data_nascimento || "",
    peso: a.peso_atual || 0, gmd: 0,
    lote: a.pasto_atual || "—",
    status: (a.status || "ATIVO").toUpperCase(),
    saude: "ok", custoTotal: a.valor_compra || 0, raca: a.raca || "—",
  };
}

  const [form, setForm] = React.useState({
    brinco:"", data: new Date().toISOString().slice(0,10),
    peso_kg:"", responsavel:"", obs:""
  });

  React.useEffect(() => { carregarDados(); }, []);

  async function carregarDados() {
    setLoading(true);
    const [p, a] = await Promise.all([
      window.Api?.pesagens(), window.Api?.animais(),
    ]);
    if (p?.length) setPesagens(p.map(w => ({...w, date:w.data||w.date, id:w.brinco||w.id, peso:w.peso_kg||w.peso, gmd:w.gmd||0, obs:w.obs||""})));
    if (a?.length) setAnimais(a.map(_mapAnimal));
    setLoading(false);
  }

  async function salvarPesagem(e) {
    e.preventDefault();
    if (!form.brinco || !form.peso_kg) return;
    setSalvando(true);
    const res = await window.Api?.criarPesagem({
      brinco: form.brinco, data: form.data,
      peso_kg: parseFloat(form.peso_kg),
      responsavel: form.responsavel, obs: form.obs,
    });
    setSalvando(false);
    if (res) {
      setShowForm(false);
      setForm({ brinco:"", data:new Date().toISOString().slice(0,10), peso_kg:"", responsavel:"", obs:"" });
      await carregarDados();
      alert("Pesagem registrada!");
    } else {
      alert("Erro ao salvar pesagem. Verifique o brinco.");
    }
  }

  const cats = ["Todas","Boi","Vaca","Bezerro"];
  const hist = pesagens.filter(w => {
    if (filtro==="Todas") return true;
    const a = animais.find(x => x.brinco===w.brinco||x.id===(w.brinco||w.id));
    return (a?.categoria||"").toLowerCase() === filtro.toLowerCase();
  });
  const gmdMedio = pesagens.length
    ? (pesagens.reduce((s,w)=>s+(w.gmd||0),0)/pesagens.length).toFixed(2) : "—";

  return (
    <div className="content">
      <div style={{display:"flex",alignItems:"flex-end",justifyContent:"space-between",marginBottom:16}}>
        <div>
          <div style={{fontSize:22,fontWeight:600,letterSpacing:"-0.015em"}}>Pesagem</div>

          <button className="btn btn-primary" onClick={()=>setShowForm(!showForm)}>
            <Icons.Plus size={14}/> {showForm?"Fechar":"Nova pesagem"}
          </button>
        </div>

function SanidadeScreen() {
  const [registros, setRegistros] = React.useState(DATA.HEALTH_LOG);
  const [animais,   setAnimais]   = React.useState(DATA.ANIMALS);
  const [showForm,  setShowForm]  = React.useState(false);
  const [salvando,  setSalvando]  = React.useState(false);
  const [filtro,    setFiltro]    = React.useState("Todas");
  const [form, setForm] = React.useState({
    brinco:"", data:new Date().toISOString().slice(0,10),
    tipo:"VACINACAO", produto:"", dose:"", medico_vet:"",
    proxima_data:"", custo:"",
  });

  React.useEffect(() => { carregarDados(); }, []);

  async function carregarDados() {
    const [s, a] = await Promise.all([
      window.Api?.sanidade(), window.Api?.animais(),
    ]);
    if (s?.length) setRegistros(s.map(r=>({...r, date:r.data||r.date, animal:r.brinco||r.animal, produto:r.produto||r.medicamento, proximo:r.proxima_data||r.proximo})));
    if (a?.length) setAnimais(a.map(_mapAnimal));
  }

  async function salvar(e) {
    e.preventDefault();
    setSalvando(true);
    const res = await window.Api?.criarSanidade({
      brinco: form.brinco, data: form.data, tipo: form.tipo,
      produto: form.produto, dose: form.dose,
      medico_vet: form.medico_vet,
      proxima_data: form.proxima_data || null,
      custo: parseFloat(form.custo) || null,
    });
    setSalvando(false);
    if (res) {
      setShowForm(false);
      await carregarDados();
      alert("Aplicação registrada!");
    } else {
      alert("Erro ao salvar. Verifique o brinco.");
    }
  }

  const tipos = ["Todas","VACINACAO","VERMIFUGO","TRATAMENTO","EXAME"];
  const hist = registros.filter(r => filtro==="Todas" || r.tipo===filtro);

  return (

        </div>
        <button className="btn btn-primary" onClick={()=>setShowForm(!showForm)}>
          <Icons.Plus size={14}/> {showForm?"Fechar":"Aplicar"}
        </button>
      </div>

      {showForm && (
        <div className="card" style={{marginBottom:16,padding:20}}>
          <div style={{fontSize:14,fontWeight:600,marginBottom:14}}>Registrar aplicação</div>
          <form onSubmit={salvar}>
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:10,marginBottom:10}}>
              <div className="field">
                <label>Animal *</label>
                <select value={form.brinco} onChange={e=>setForm(f=>({...f,brinco:e.target.value}))} required>
                  <option value="">Selecione...</option>
                  {animais.map(a=>(
                    <option key={a.brinco||a.id} value={a.brinco||a.id}>{a.brinco||a.id} — {a.categoria}</option>
                  ))}
                </select>
              </div>
              <div className="field">
                <label>Data *</label>
                <input type="date" value={form.data} onChange={e=>setForm(f=>({...f,data:e.target.value}))} required/>
              </div>
              <div className="field">
                <label>Tipo *</label>
                <select value={form.tipo} onChange={e=>setForm(f=>({...f,tipo:e.target.value}))}>
                  <option value="VACINACAO">Vacinação</option>
                  <option value="VERMIFUGO">Vermífugo</option>
                  <option value="TRATAMENTO">Tratamento</option>
                  <option value="EXAME">Exame</option>
                  <option value="BRUCELOSE">Brucelose</option>
                </select>
              </div>
              <div className="field">
                <label>Produto *</label>
                <input placeholder="Ex.: Aftosa dose 1" value={form.produto}
                  onChange={e=>setForm(f=>({...f,produto:e.target.value}))} required/>
              </div>
              <div className="field">

                  onChange={e=>setForm(f=>({...f,dose:e.target.value}))}/>
              </div>
              <div className="field">
                <label>Veterinário</label>
                <input placeholder="Nome" value={form.medico_vet}
                  onChange={e=>setForm(f=>({...f,medico_vet:e.target.value}))}/>
              </div>
              <div className="field">
                <label>Próxima aplicação</label>
                <input type="date" value={form.proxima_data}
                  onChange={e=>setForm(f=>({...f,proxima_data:e.target.value}))}/>
              </div>
              <div className="field">
                <label>Custo (R$)</label>
                <input type="number" step="0.01" placeholder="0.00" value={form.custo}
                  onChange={e=>setForm(f=>({...f,custo:e.target.value}))}/>

function ModalDespesa({ onClose }) {
  const [form, setForm] = React.useState({
    descricao:"", valor:"", data:new Date().toISOString().slice(0,10),
    categoria:"NUTRICAO", status:"PENDENTE", vencimento:"", fornecedor:"", obs:"",
  });
  const [salvando, setSalvando] = React.useState(false);
  const F = ({label,children}) => <div className="field"><label>{label}</label>{children}</div>;

  async function salvar(e) {
    e.preventDefault();
    if (!form.descricao || !form.valor) return;
    setSalvando(true);
    const res = await window.Api?.criarDespesa({
      descricao: form.descricao, valor: parseFloat(form.valor),
      data: form.data, categoria: form.categoria, status: form.status,
      vencimento: form.vencimento || null, fornecedor: form.fornecedor || null, obs: form.obs || null,
    });
    setSalvando(false);
    if (res) {
      if (window.onDespesaCadastrada) window.onDespesaCadastrada();
      onClose();
      alert("Despesa lançada!");
    } else {
      alert("Erro ao salvar despesa.");
    }
  }

  return (
    <div className="modal-backdrop" onClick={onClose}>
      <div className="modal" onClick={e => e.stopPropagation()}>
        <div className="modal-head">
          <div className="modal-title">Nova despesa</div>
          <button className="topbar-iconbtn" onClick={onClose}><Icons.Close size={16} /></button>

        <form onSubmit={salvar}>

              <input placeholder="Ex.: Sal mineral — 4 sacos" value={form.descricao}
                onChange={e=>setForm(f=>({...f,descricao:e.target.value}))} required/>
            </F>
            <div className="field-row">
              <F label="Valor (R$) *">
                <input type="number" step="0.01" placeholder="168.00" value={form.valor}

              <F label="Data *">

              </F>
            </div>
            <div className="field-row">
              <F label="Categoria">
                <select value={form.categoria} onChange={e=>setForm(f=>({...f,categoria:e.target.value}))}>
                  {["NUTRICAO","SANIDADE","PESSOAL","OPERACAO","INFRAESTRUTURA","AQUISICAO","OUTRO"].map(c=>(

                <input placeholder="Nome" value={form.fornecedor}

// ─── TOAST SYSTEM ─────────────────────────────────────────────────────────
const ToastCtx = React.createContext(() => {});
function ToastProvider({ children }) {
  const [items, setItems] = useState([]);
  const push = (t) => {
    const id = Math.random().toString(36).slice(2);
    setItems((xs) => [...xs, { id, ...t }]);
    setTimeout(() => setItems((xs) => xs.filter((x) => x.id !== id)), t.ttl || 3200);
  };
  return (
    <ToastCtx.Provider value={push}>
      {children}
      <div style={{ position: "fixed", bottom: 20, left: "50%", transform: "translateX(-50%)", zIndex: 120, display: "grid", gap: 8 }}>
        {items.map((t) => (
          <div key={t.id} style={{
            background: "var(--navy)", color: "white",
            padding: "10px 14px", borderRadius: 10,
            boxShadow: "0 10px 30px oklch(0.15 0.02 250 / 0.3)",
            display: "flex", alignItems: "center", gap: 10, minWidth: 240,
            animation: "rise 180ms cubic-bezier(.2,.8,.2,1)",
            fontSize: 13,
          }}>
            <div style={{
              width: 22, height: 22, borderRadius: 50,
              background: t.tone === "bad" ? "var(--bad)" : "var(--good)",
              display: "grid", placeItems: "center",
            }}>
              <Icons.Check size={12} strokeWidth={3} />
            </div>
            <span>{t.msg}</span>
          </div>
        ))}
      </div>
    </ToastCtx.Provider>
  );
}
const useToast = () => React.useContext(ToastCtx);

// ─── COMMAND PALETTE ──────────────────────────────────────────────────────
function CommandPalette({ open, onClose, setRoute, openModal, openSale }) {
  const [q, setQ] = useState("");
  const inputRef = useRef(null);

  useEffect(() => {
    if (open) setTimeout(() => inputRef.current?.focus(), 30);
    if (open) setQ("");
  }, [open]);

  const actions = useMemo(() => [
    { kind: "Ir para", label: "Dashboard", icon: Icons.Dashboard, do: () => setRoute("dashboard") },
    { kind: "Ir para", label: "Animais", icon: Icons.Cow, do: () => setRoute("animais") },
    { kind: "Ir para", label: "Pesagem", icon: Icons.Scale, do: () => setRoute("pesagem") },
    { kind: "Ir para", label: "Sanidade", icon: Icons.Health, do: () => setRoute("sanidade") },
    { kind: "Ir para", label: "Nutrição", icon: Icons.Nutri, do: () => setRoute("nutricao") },
    { kind: "Ir para", label: "Confinamento", icon: Icons.Feedlot, do: () => setRoute("confinamento") },
    { kind: "Ir para", label: "Pastagem & Lotes", icon: Icons.Pasture, do: () => setRoute("pastagem") },
    { kind: "Ir para", label: "Financeiro", icon: Icons.Money, do: () => setRoute("financeiro") },
    { kind: "Ir para", label: "Relatórios", icon: Icons.Report, do: () => setRoute("relatorios") },
    { kind: "Ação", label: "Nova despesa", icon: Icons.DollarIn, shortcut: "N D", do: () => openModal("despesa") },
    { kind: "Ação", label: "Novo animal", icon: Icons.Plus, shortcut: "N A", do: () => openModal("animal") },
    { kind: "Ação", label: "Simular venda", icon: Icons.Trend, shortcut: "S V", do: () => openSale() },
    ...DATA.ANIMALS.map((a) => ({
      kind: "Animal", label: `${a.id} · ${a.categoria} · ${a.peso} kg`,
      icon: Icons.Cow, do: () => setRoute("animais"),
    })),
    ...DATA.PASTURES.lotes.map((l) => ({
      kind: "Piquete", label: `${l.id} · ${l.area} ha · ${l.status.toLowerCase()}`,
      icon: Icons.Pasture, do: () => setRoute("pastagem"),
    })),
  ], [setRoute, openModal, openSale]);

  const matches = q
    ? actions.filter((a) => (a.label + " " + a.kind).toLowerCase().includes(q.toLowerCase())).slice(0, 8)
    : actions.slice(0, 8);

  const [idx, setIdx] = useState(0);
  useEffect(() => { setIdx(0); }, [q]);

  const onKey = (e) => {
    if (e.key === "ArrowDown") { e.preventDefault(); setIdx((i) => Math.min(i + 1, matches.length - 1)); }
    if (e.key === "ArrowUp")   { e.preventDefault(); setIdx((i) => Math.max(i - 1, 0)); }
    if (e.key === "Enter")     { e.preventDefault(); matches[idx]?.do(); onClose(); }
    if (e.key === "Escape")    { onClose(); }
  };

  if (!open) return null;
  return (
    <div className="modal-backdrop" onClick={onClose}>
      <div
        onClick={(e) => e.stopPropagation()}
        style={{
          width: "min(620px, 92vw)",
          background: "var(--surface)",
          borderRadius: 12,
          border: "1px solid var(--border)",
          boxShadow: "0 30px 60px oklch(0.15 0.02 250 / 0.35)",
          overflow: "hidden",
          marginTop: -80,
        }}>
        <div style={{ display: "flex", alignItems: "center", gap: 10, padding: "12px 14px", borderBottom: "1px solid var(--border)" }}>
          <Icons.Search size={16} />
          <input
            ref={inputRef}
            value={q}
            onChange={(e) => setQ(e.target.value)}
            onKeyDown={onKey}
            placeholder="Buscar animais, ações, telas…"
            style={{ flex: 1, border: 0, outline: 0, background: "transparent", fontFamily: "inherit", fontSize: 14, color: "var(--ink)" }}
          />
          <span className="chip" style={{ fontFamily: "var(--font-mono)", fontSize: 10 }}>ESC</span>
        </div>
        <div style={{ maxHeight: 380, overflow: "auto", padding: 6 }}>
          {matches.length === 0 && (
            <div style={{ padding: 20, textAlign: "center", color: "var(--muted)", fontSize: 13 }}>Nenhum resultado</div>
          )}
          {matches.map((m, i) => {
            const IconEl = m.icon;
            const active = i === idx;
            return (
              <button
                key={i}
                onMouseEnter={() => setIdx(i)}
                onClick={() => { m.do(); onClose(); }}
                style={{
                  width: "100%", textAlign: "left",
                  display: "grid", gridTemplateColumns: "auto 1fr auto auto", gap: 10, alignItems: "center",
                  padding: "8px 10px", borderRadius: 6,
                  background: active ? "var(--accent-soft)" : "transparent",
                  color: active ? "var(--accent-ink)" : "var(--ink)",
                }}
              >
                <IconEl size={16} className="" />
                <span style={{ fontSize: 13 }}>{m.label}</span>
                <span className="chip" style={{ fontSize: 10, opacity: 0.7 }}>{m.kind}</span>
                {m.shortcut && <span style={{ fontFamily: "var(--font-mono)", fontSize: 10, color: "var(--muted)" }}>{m.shortcut}</span>}
              </button>
            );
          })}
        </div>
        <div style={{ padding: "8px 14px", borderTop: "1px solid var(--border)", fontSize: 11, color: "var(--muted)", display: "flex", gap: 14 }}>
          <span><span style={{ fontFamily: "var(--font-mono)" }}>↑↓</span> navegar</span>
          <span><span style={{ fontFamily: "var(--font-mono)" }}>↵</span> selecionar</span>
          <span><span style={{ fontFamily: "var(--font-mono)" }}>⌘K</span> abrir</span>
        </div>
      </div>
    </div>
  );
}

          width: "min(520px, 92vw)", height: "100vh",
          background: "var(--surface)",
          borderLeft: "1px solid var(--border)",

          <div>

// ─── SALE SIMULATOR ───────────────────────────────────────────────────────
function SaleSimulator({ open, onClose }) {
  const [precoArroba, setPrecoArroba] = useState(295);
  const [rendimento, setRendimento] = useState(53);
  const [picked, setPicked] = useState({ "BOI-001": true, "BOI-002": true });

  if (!open) return null;
  const animals = DATA.ANIMALS;
  const selected = animals.filter(a => picked[a.id]);
  const totalKg = selected.reduce((s, a) => s + a.peso, 0);
  const carcass = totalKg * (rendimento / 100);
  const arrobas = carcass / 15;
  const receita = arrobas * precoArroba;
  const custo = selected.reduce((s, a) => s + a.custoTotal, 0);
  const lucro = receita - custo;
  const roi = custo > 0 ? (lucro / custo) * 100 : 0;

  return (
    <div className="modal-backdrop" onClick={onClose}>
      <div
        onClick={(e) => e.stopPropagation()}
        style={{
          width: "min(820px, 95vw)", maxHeight: "90vh", overflow: "auto",
          background: "var(--surface)", borderRadius: 12,
          border: "1px solid var(--border)",
          boxShadow: "0 30px 60px oklch(0.15 0.02 250 / 0.3)",
        }}
      >
        <div style={{ padding: "18px 22px", borderBottom: "1px solid var(--border)", display: "flex", justifyContent: "space-between", alignItems: "flex-start" }}>
          <div>
            <div style={{ fontSize: 11, color: "var(--muted)", textTransform: "uppercase", letterSpacing: "0.08em", fontWeight: 600 }}>Ferramenta</div>
            <div style={{ fontSize: 20, fontWeight: 600, letterSpacing: "-0.015em", marginTop: 2 }}>Simulador de venda</div>
            <div style={{ fontSize: 12.5, color: "var(--muted)", marginTop: 2 }}>Estime receita, lucro e ROI do lote escolhido</div>
          </div>
          <button className="topbar-iconbtn" onClick={onClose}><Icons.Close size={16} /></button>
        </div>
        <div style={{ padding: 22, display: "grid", gridTemplateColumns: "1fr 280px", gap: 22 }}>
          <div>
            <div style={{ fontSize: 12, fontWeight: 600, marginBottom: 10 }}>Selecione os animais</div>
            <div style={{ border: "1px solid var(--border)", borderRadius: 8, overflow: "hidden" }}>
              <table className="table" style={{ fontSize: 12 }}>
                <thead>
                  <tr>
                    <th style={{ width: 28 }}></th>
                    <th>ID</th><th>Cat.</th>
                    <th className="num">Peso</th>
                    <th className="num">Custo</th>
                  </tr>
                </thead>
                <tbody>
                  {animals.map(a => (
                    <tr key={a.id} onClick={() => setPicked(p => ({ ...p, [a.id]: !p[a.id] }))} style={{ cursor: "pointer", background: picked[a.id] ? "var(--accent-soft)" : undefined }}>
                      <td><input type="checkbox" checked={!!picked[a.id]} readOnly /></td>
                      <td style={{ fontWeight: 500, color: picked[a.id] ? "var(--accent-ink)" : "var(--ink)" }}>{a.id}</td>
                      <td>{a.categoria}</td>
                      <td className="num">{a.peso} kg</td>
                      <td className="num">R$ {brlShort(a.custoTotal)}</td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>

            <div style={{ marginTop: 16, display: "grid", gridTemplateColumns: "1fr 1fr", gap: 12 }}>
              <div className="field">
                <label>Preço da arroba (R$)</label>
                <input type="number" value={precoArroba} onChange={e => setPrecoArroba(+e.target.value)} />
              </div>
              <div className="field">
                <label>Rendimento carcaça (%)</label>
                <input type="number" value={rendimento} onChange={e => setRendimento(+e.target.value)} />
              </div>
            </div>
          </div>

          <div style={{ background: "var(--bg-2)", borderRadius: 10, padding: 16, border: "1px solid var(--border)", display: "flex", flexDirection: "column", gap: 12 }}>
            <div>
              <div style={{ fontSize: 10.5, letterSpacing: "0.08em", textTransform: "uppercase", color: "var(--muted)", fontWeight: 600 }}>Selecionados</div>
              <div className="num" style={{ fontSize: 24, fontWeight: 500, letterSpacing: "-0.03em" }}>{selected.length} <span style={{ fontSize: 12, color: "var(--muted)" }}>animais</span></div>
            </div>
            <div>
              <div className="kpi-label">Peso vivo total</div>
              <div className="num" style={{ fontSize: 20, marginTop: 2, letterSpacing: "-0.02em" }}>{totalKg.toFixed(0)} kg</div>
            </div>
            <div>
              <div className="kpi-label">Arrobas (carcaça)</div>
              <div className="num" style={{ fontSize: 20, marginTop: 2, letterSpacing: "-0.02em" }}>{arrobas.toFixed(2)} @</div>
            </div>
            <hr className="hr" />
            <div>
              <div className="kpi-label">Receita bruta</div>
              <div className="num" style={{ fontSize: 24, marginTop: 2, letterSpacing: "-0.03em", fontWeight: 500 }}>R$ {brlShort(receita)}</div>

            <div>
              <div className="kpi-label">Custo acumulado</div>

              <div className="num" style={{ fontSize: 28, marginTop: 2, letterSpacing: "-0.03em", fontWeight: 500 }}>R$ {brlShort(lucro)}</div>
              <div style={{ fontSize: 11.5, marginTop: 2 }}>ROI {roi.toFixed(1)}%</div>
            </div>
          </div>
        </div>
        <div className="modal-foot">
          <button className="btn" onClick={onClose}>Fechar</button>
          <button className="btn btn-primary" onClick={onClose}>Salvar simulação</button>
        </div>
      </div>
    </div>
  );
}

// ═══ App ═══

const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "variant": "bold",
  "density": "compact"
}/*EDITMODE-END*/;

function App() {
  const [route, _setRouteState] = useState(() => localStorage.getItem("fi.route") || "dashboard");
  // setRoute navega via URL real para telas fora do dashboard
  const setRoute = React.useCallback((key) => {
    if (ROUTE_URLS[key]) {
      window.location.href = ROUTE_URLS[key];
    } else {
      _setRouteState(key);
    }
  }, []);
  const [modal, setModal] = useState(null);
  const [variant, setVariant] = useState(TWEAK_DEFAULTS.variant);
  const [density, setDensity] = useState(TWEAK_DEFAULTS.density);
  const [tweaksOn, setTweaksOn] = useState(false);
  const [cmdkOpen, setCmdkOpen] = useState(false);
  const [drill, setDrill] = useState(null);
  const [saleOpen, setSaleOpen] = useState(false);

  useEffect(() => { localStorage.setItem("fi.route", "dashboard"); }, [route]);
  useEffect(() => { document.body.dataset.variant = variant; }, [variant]);
  useEffect(() => { document.body.dataset.density = density; }, [density]);

  // Cmd+K
  useEffect(() => {
    const onKey = (e) => {
      if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "k") {
        e.preventDefault();
        setCmdkOpen(o => !o);
      }
    };
    window.addEventListener("keydown", onKey);
    return () => window.removeEventListener("keydown", onKey);
  }, []);

  // Tweaks protocol
  useEffect(() => {
    const onMsg = (e) => {
      const t = e.data?.type;
      if (t === "__activate_edit_mode") setTweaksOn(true);
      else if (t === "__deactivate_edit_mode") setTweaksOn(false);
    };
    window.addEventListener("message", onMsg);
    window.parent.postMessage({ type: "__edit_mode_available" }, "*");
    return () => window.removeEventListener("message", onMsg);
  }, []);

  useEffect(() => {
    if (!tweaksOn) return;
    window.parent.postMessage({ type: "__edit_mode_set_keys", edits: { variant, density } }, "*");
  }, [variant, density, tweaksOn]);

  const openModal = (k) => setModal(k);
  const closeModal = () => setModal(null);
  const openDrill = (d) => setDrill(d);
  const openSale = () => setSaleOpen(true);

  let Screen = null;
  switch (route) {
    case "dashboard": Screen = <Dashboard variant={variant} setRoute={setRoute} openModal={openModal} openDrill={openDrill} openSale={openSale} />; break;
    case "animais": Screen = <AnimaisScreen setRoute={setRoute} openModal={openModal} />; break;
    case "pesagem": Screen = <PesagemScreen />; break;
    case "sanidade": Screen = <SanidadeScreen />; break;
    case "nutricao": Screen = <NutricaoScreen />; break;
    case "confinamento": Screen = <ConfinamentoScreen />; break;
    case "pastagem": Screen = <PastagemScreen />; break;
    case "financeiro": Screen = <FinanceiroScreen openModal={openModal} />; break;
    case "relatorios": Screen = <RelatoriosScreen />; break;
    default: Screen = <PlaceholderScreen label={ROUTE_LABELS[route] || route} />;
  }

  return (
    <ToastProvider>
      <div className="app" data-screen-label={`${route}`}>
        <Sidebar route={route} setRoute={setRoute} openModal={openModal} openSale={openSale} />
        <div className="main">
          <Topbar route={route} setRoute={setRoute} openCmdk={() => setCmdkOpen(true)} openSale={openSale} />
          {Screen}
        </div>
        <BottomNav route={route} setRoute={setRoute} />
        {modal === "despesa" && <ModalDespesa onClose={closeModal} />}
        {modal === "animal" && <ModalAnimal onClose={closeModal} />}
        <CommandPalette open={cmdkOpen} onClose={() => setCmdkOpen(false)} setRoute={setRoute} openModal={openModal} openSale={openSale} />
        <DrillSheet drill={drill} onClose={() => setDrill(null)} />
        <SaleSimulator open={saleOpen} onClose={() => setSaleOpen(false)} />
        <TweaksPanel
          variant={variant} setVariant={setVariant}
          density={density} setDensity={setDensity}
          tweaksOn={tweaksOn}
        />
      </div>
    </ToastProvider>
  );
}

function PlaceholderScreen({ label }) {
  return (
    <div className="content">
      <div style={{fontSize: 22, fontWeight: 600, marginBottom: 8}}>{label}</div>
      <div className="card" style={{padding: 40, textAlign: "center", color: "var(--muted)"}}>
        Em construção
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
