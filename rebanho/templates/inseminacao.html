{% extends "base.html" %}
{% block title %}Controle de Inseminação — Fazenda Ipanema{% endblock %}
{% block page_title %}Controle de Inseminação{% endblock %}

{% block content %}
<style>
  .lbl{display:block;font-size:10.5px;font-weight:600;color:#888;text-transform:uppercase;letter-spacing:.4px;margin-bottom:4px}
  .inp{width:100%;border:0.5px solid #e8e8e8;border-radius:7px;padding:7px 10px;font-size:12.5px;box-sizing:border-box;font-family:inherit}
  .inp:focus{outline:none;border-color:#4caf50;box-shadow:0 0 0 3px rgba(76,175,80,.1)}
  .sel{background:#fff}
  .badge{display:inline-block;padding:2px 9px;border-radius:10px;font-size:10px;font-weight:600}
</style>

<!-- Barra de filtros + ações -->
<div style="background:#fff;border-radius:10px;padding:14px 20px;margin-bottom:14px;box-shadow:0 1px 4px rgba(0,0,0,.07);">
  <div style="display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;">
    <div><label class="lbl">BRINCO</label><input id="fiBrinco" class="inp" style="width:130px;" /></div>
    <div><label class="lbl">STATUS</label>
      <select id="fiStatus" class="inp sel" style="width:160px;"><option value="">Todos</option></select>
    </div>
    <div><label class="lbl">DATA INÍCIO</label><input id="fiInicio" type="date" class="inp" style="width:140px;" /></div>
    <div><label class="lbl">DATA FIM</label><input id="fiFim" type="date" class="inp" style="width:140px;" /></div>
    <button onclick="filtrarInsem()" style="background:#1B5E20;color:#fff;border:none;border-radius:6px;padding:7px 16px;cursor:pointer;font-size:13px;">🔍 Filtrar</button>
    <button onclick="limparFiltroInsem()" style="background:#e5e7eb;color:#374151;border:none;border-radius:6px;padding:7px 14px;cursor:pointer;font-size:13px;">✖ Limpar</button>
    <div style="margin-left:auto;display:flex;gap:8px;">
      <button onclick="window.location.href='/exportar/inseminacoes'" style="background:#6b7280;color:#fff;border:none;border-radius:6px;padding:7px 14px;cursor:pointer;font-size:13px;">📥 Exportar CSV</button>
      <button onclick="abrirModalInsem()" style="background:#2E7D32;color:#fff;border:none;border-radius:6px;padding:7px 16px;cursor:pointer;font-size:13px;">➕ Nova Inseminação</button>
    </div>
  </div>
</div>

<!-- Tabela -->
<div style="background:#fff;border-radius:10px;box-shadow:0 1px 4px rgba(0,0,0,.07);overflow:hidden;">
  <div style="overflow-x:auto;">
    <table style="width:100%;border-collapse:collapse;font-size:13px;">
      <thead>
        <tr style="background:#F1F8E9;color:#33691e;">
          <th style="padding:10px 12px;text-align:left;border-bottom:2px solid #C8E6C9;">ID</th>
          <th style="padding:10px 12px;text-align:left;border-bottom:2px solid #C8E6C9;">Brinco</th>
          <th style="padding:10px 12px;text-align:center;border-bottom:2px solid #C8E6C9;">Data Insem.</th>
          <th style="padding:10px 12px;text-align:center;border-bottom:2px solid #C8E6C9;">Prenhez</th>
          <th style="padding:10px 12px;text-align:center;border-bottom:2px solid #C8E6C9;">Qtd Crias</th>
          <th style="padding:10px 12px;text-align:center;border-bottom:2px solid #C8E6C9;">Nasc. Crias</th>
          <th style="padding:10px 12px;text-align:center;border-bottom:2px solid #C8E6C9;">Status</th>
          <th style="padding:10px 12px;text-align:center;border-bottom:2px solid #C8E6C9;">Ações</th>
        </tr>
      </thead>
      <tbody id="tbodyInsem"></tbody>
    </table>
  </div>
</div>

<!-- Modal -->
<div id="modalInsem" style="position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:200;display:none;align-items:center;justify-content:center;">
  <div style="background:#fff;border-radius:12px;width:100%;max-width:560px;box-shadow:0 8px 32px rgba(0,0,0,.2);">
    <div style="padding:16px 22px;border-bottom:1px solid #e5e7eb;display:flex;justify-content:space-between;align-items:center;">
      <h2 id="modalInsemTitulo" style="font-size:15px;font-weight:600;color:#1B5E20;"></h2>
      <button onclick="fecharModalInsem()" style="background:none;border:none;font-size:20px;cursor:pointer;color:#6b7280;">✕</button>
    </div>
    <form id="formInsem" onsubmit="salvarInsem(event)" style="padding:18px 22px;">
      <input type="hidden" id="insemEditId" />
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;">
        <div>
          <label class="lbl">Animal (Fêmea Ativa) *</label>
          <select id="insemBrinco" class="inp sel" required>
            <option value="">Selecione...</option>
          </select>
        </div>
        <div><label class="lbl">Data Inseminação *</label><input id="insemData" type="date" class="inp" required /></div>
        <div><label class="lbl">Prenhez</label>
          <select id="insemPrenhez" class="inp sel"><option value="">—</option></select></div>
        <div><label class="lbl">Status *</label>
          <select id="insemStatus" class="inp sel" required><option value="">Selecione</option></select></div>
        <div><label class="lbl">Qtd Crias</label><input id="insemQtd" type="number" min="0" class="inp" value="0" /></div>
        <div><label class="lbl">Data Nasc. Crias</label><input id="insemNasc" type="date" class="inp" /></div>
        <div style="grid-column:1/-1;"><label class="lbl">Observações</label><textarea id="insemObs" class="inp" rows="2"></textarea></div>
      </div>
      <div style="margin-top:16px;display:flex;justify-content:flex-end;gap:10px;">
        <button type="button" onclick="fecharModalInsem()" style="background:#e5e7eb;color:#374151;border:none;border-radius:6px;padding:7px 18px;cursor:pointer;font-size:13px;">Cancelar</button>
        <button type="submit" style="background:#1B5E20;color:#fff;border:none;border-radius:6px;padding:7px 18px;cursor:pointer;font-size:13px;">💾 Salvar</button>
      </div>
    </form>
  </div>
</div>

{% endblock %}

{% block scripts %}
<script>
let defsInsem = {};
let femeaAtivas = [];

async function init() {
  defsInsem = await fetch('/definicoes').then(r => r.json());
  _pop('fiStatus',     defsInsem.status_inseminacao, true);
  _pop('insemPrenhez', defsInsem.prenhez,             false);
  _pop('insemStatus',  defsInsem.status_inseminacao,  false);

  // Fêmeas ativas
  const animais = await fetch('/animais?status=ATIVO&sexo=FÊMEA').then(r => r.json());
  femeaAtivas = animais;
  const sel = document.getElementById('insemBrinco');
  animais.forEach(a => {
    const o = document.createElement('option');
    o.value = a.brinco;
    o.textContent = `${a.brinco}${a.nome ? ' — ' + a.nome : ''}`;
    sel.appendChild(o);
  });

  document.getElementById('insemData').value = new Date().toISOString().split('T')[0];
  await filtrarInsem();
}

function _pop(id, lista, comTodos) {
  const el = document.getElementById(id); if (!el) return;
  el.innerHTML = (comTodos ? '<option value="">Todos</option>' : '<option value="">Selecione</option>')
    + lista.map(v => `<option>${v}</option>`).join('');
}

async function filtrarInsem() {
  const params = new URLSearchParams();
  const b = document.getElementById('fiBrinco').value.trim();
  const s = document.getElementById('fiStatus').value;
  const i = document.getElementById('fiInicio').value;
  const f = document.getElementById('fiFim').value;
  if (b) params.set('brinco', b);
  if (s) params.set('status', s);
  if (i) params.set('data_inicio', i);
  if (f) params.set('data_fim', f);
  const lista = await fetch('/inseminacoes?' + params).then(r => r.json());
  renderInsem(lista);
}

function limparFiltroInsem() {
  ['fiBrinco','fiInicio','fiFim'].forEach(id => document.getElementById(id).value = '');
  document.getElementById('fiStatus').value = '';
  filtrarInsem();
}

function badgeInsem(status) {
  const mapa = {
    'CONFIRMADA':     {bg:'#dcfce7', cor:'#166534'},
    'NÃO CONFIRMADA': {bg:'#fee2e2', cor:'#991b1b'},
    'AGUARDANDO':     {bg:'#FFF8E1', cor:'#92400e'},
  };
  const c = mapa[status] || {bg:'#f3f4f6', cor:'#374151'};
  return `<span class="badge" style="background:${c.bg};color:${c.cor};">${status || '—'}</span>`;
}

function renderInsem(lista) {
  const tbody = document.getElementById('tbodyInsem');
  if (!lista.length) {
    tbody.innerHTML = '<tr><td colspan="8" style="text-align:center;padding:18px;color:#9ca3af;">Nenhum registro.</td></tr>';
    return;
  }
  tbody.innerHTML = lista.map((r, i) => `
    <tr style="background:${i%2===0?'#fff':'#fafafa'};border-bottom:1px solid #f3f4f6;">
      <td style="padding:8px 12px;color:#6b7280;">${r.id}</td>
      <td style="padding:8px 12px;font-weight:600;color:#1B5E20;">${r.brinco}</td>
      <td style="padding:8px 12px;text-align:center;">${fmtData(r.data_insem)}</td>
      <td style="padding:8px 12px;text-align:center;">${r.prenhez || '—'}</td>
      <td style="padding:8px 12px;text-align:center;">${r.qtd_crias ?? 0}</td>
      <td style="padding:8px 12px;text-align:center;">${r.data_nasc_cria ? fmtData(r.data_nasc_cria) : '—'}</td>
      <td style="padding:8px 12px;text-align:center;">${badgeInsem(r.status)}</td>
      <td style="padding:8px 12px;text-align:center;white-space:nowrap;">
        <button onclick='editarInsem(${JSON.stringify(r)})' style="background:#e5e7eb;border:none;border-radius:5px;padding:3px 8px;cursor:pointer;font-size:13px;">✏️</button>
        <button onclick="confirmarExclusao('/inseminacoes/${r.id}', filtrarInsem)" style="background:#fee2e2;border:none;border-radius:5px;padding:3px 8px;cursor:pointer;font-size:13px;">🗑️</button>
      </td>
    </tr>`).join('');
}

function abrirModalInsem(reg) {
  document.getElementById('modalInsem').style.display = 'flex';
  document.getElementById('modalInsemTitulo').textContent = reg ? 'Editar Inseminação' : 'Nova Inseminação';
  document.getElementById('formInsem').reset();
  document.getElementById('insemEditId').value = '';
  document.getElementById('insemData').value = new Date().toISOString().split('T')[0];
  if (reg) {
    document.getElementById('insemEditId').value  = reg.id;
    document.getElementById('insemBrinco').value  = reg.brinco;
    document.getElementById('insemData').value    = reg.data_insem;
    document.getElementById('insemPrenhez').value = reg.prenhez || '';
    document.getElementById('insemStatus').value  = reg.status || '';
    document.getElementById('insemQtd').value     = reg.qtd_crias ?? 0;
    document.getElementById('insemNasc').value    = reg.data_nasc_cria || '';
    document.getElementById('insemObs').value     = reg.obs || '';
    document.getElementById('insemBrinco').disabled = true;
  } else {
    document.getElementById('insemBrinco').disabled = false;
  }
}

function editarInsem(r) { abrirModalInsem(r); }
function fecharModalInsem() {
  document.getElementById('modalInsem').style.display = 'none';
  document.getElementById('insemBrinco').disabled = false;
}

async function salvarInsem(ev) {
  ev.preventDefault();
  const id = document.getElementById('insemEditId').value;
  const body = {
    brinco:         document.getElementById('insemBrinco').value,
    data_insem:     document.getElementById('insemData').value,
    prenhez:        document.getElementById('insemPrenhez').value || null,
    status:         document.getElementById('insemStatus').value,
    qtd_crias:      parseInt(document.getElementById('insemQtd').value) || 0,
    data_nasc_cria: document.getElementById('insemNasc').value || null,
    obs:            document.getElementById('insemObs').value.trim() || null,
  };
  const url    = id ? `/inseminacoes/${id}` : '/inseminacoes';
  const method = id ? 'PUT' : 'POST';
  const r = await fetch(url, { method, headers:{'Content-Type':'application/json'}, body: JSON.stringify(body) });
  const d = await r.json();
  if (!r.ok) { showToast(d.detail || 'Erro ao salvar.', 'erro'); return; }
  fecharModalInsem();
  showToast('Inseminação salva!', 'sucesso');
  await filtrarInsem();
}

document.addEventListener('DOMContentLoaded', init);
window.addEventListener('fazenda-contexto', init);
</script>
{% endblock %}
