<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0"/>
  <title>Modo Campo — Controle Bovino</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --verde: #2d6a4f; --verde-dark: #1b4d2e; --verde-light: #d1fae5;
      --bg: #f0fdf4; --card: #fff; --border: #d1d5db;
      --text: #111827; --sub: #6b7280; --danger: #dc2626;
    }
    body { font-family: 'Segoe UI', system-ui, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

    /* ── Topbar ── */
    .c-top {
      background: var(--verde-dark); color: #fff;
      padding: 12px 16px;
      display: flex; align-items: center; justify-content: space-between;
      position: sticky; top: 0; z-index: 100;
      box-shadow: 0 2px 8px rgba(0,0,0,.25);
    }
    .c-top-left { display: flex; align-items: center; gap: 10px; }
    .c-top-icon { font-size: 22px; }
    .c-top-title { font-size: 16px; font-weight: 700; }
    .c-top-sub { font-size: 11px; opacity: .75; }
    .c-top-right { display: flex; align-items: center; gap: 8px; }
    .c-top-user { font-size: 12px; opacity: .85; }
    .btn-logout {
      background: rgba(255,255,255,.15); border: 1px solid rgba(255,255,255,.3);
      color: #fff; padding: 5px 10px; border-radius: 6px; font-size: 12px;
      cursor: pointer; white-space: nowrap;
    }
    .btn-logout:hover { background: rgba(255,255,255,.25); }

    /* ── Nav tabs ── */
    .c-nav {
      display: flex; border-bottom: 2px solid var(--border);
      background: var(--card); position: sticky; top: 54px; z-index: 99;
      overflow-x: auto; scrollbar-width: none;
    }
    .c-nav::-webkit-scrollbar { display: none; }
    .c-tab {
      flex: 1; min-width: 80px; padding: 12px 4px; text-align: center;
      font-size: 12px; font-weight: 600; color: var(--sub);
      border-bottom: 2.5px solid transparent; cursor: pointer;
      white-space: nowrap; transition: color .15s, border-color .15s;
      background: none; border-top: none; border-left: none; border-right: none;
    }
    .c-tab.ativo { color: var(--verde); border-bottom-color: var(--verde); }
    .c-tab-icon { font-size: 18px; display: block; margin-bottom: 2px; }

    /* ── Sections ── */
    .c-section { display: none; padding: 16px; padding-bottom: 80px; }
    .c-section.ativo { display: block; }

    /* ── Cards ── */
    .c-card {
      background: var(--card); border-radius: 12px; padding: 16px;
      margin-bottom: 12px; box-shadow: 0 1px 4px rgba(0,0,0,.08);
      border: 1px solid var(--border);
    }
    .c-card-title { font-size: 13px; font-weight: 700; color: var(--verde-dark); margin-bottom: 10px; }
    .c-row { display: flex; justify-content: space-between; align-items: center; padding: 6px 0; border-bottom: 1px solid #f3f4f6; }
    .c-row:last-child { border-bottom: none; }
    .c-row-label { font-size: 13px; color: var(--sub); }
    .c-row-value { font-size: 13px; font-weight: 600; }
    .badge { display: inline-block; padding: 2px 8px; border-radius: 99px; font-size: 11px; font-weight: 700; }
    .badge-ok { background: #d1fae5; color: #065f46; }
    .badge-alerta { background: #fef9c3; color: #78350f; }
    .badge-critico { background: #fee2e2; color: #991b1b; }
    .badge-sim { background: #d1fae5; color: #065f46; }
    .badge-nao { background: #fee2e2; color: #991b1b; }

    /* ── Formulário rápido ── */
    .c-form-title { font-size: 14px; font-weight: 700; margin-bottom: 14px; color: var(--verde-dark); }
    .c-field { margin-bottom: 14px; }
    .c-field label { display: block; font-size: 12px; font-weight: 600; color: var(--sub); margin-bottom: 4px; }
    .c-field input, .c-field select, .c-field textarea {
      width: 100%; padding: 10px 12px;
      border: 1.5px solid var(--border); border-radius: 8px;
      font-size: 14px; color: var(--text); outline: none;
      background: #fff; transition: border-color .15s;
    }
    .c-field input:focus, .c-field select:focus, .c-field textarea:focus { border-color: var(--verde); }
    .c-field textarea { resize: vertical; min-height: 70px; }
    .btn-primary {
      width: 100%; padding: 13px;
      background: linear-gradient(135deg, var(--verde), var(--verde-dark));
      color: #fff; border: none; border-radius: 8px;
      font-size: 15px; font-weight: 700; cursor: pointer; transition: opacity .15s;
    }
    .btn-primary:hover { opacity: .9; }
    .btn-primary:disabled { opacity: .5; cursor: not-allowed; }

    /* ── Loading ── */
    .c-loading { text-align: center; padding: 40px 16px; color: var(--sub); font-size: 14px; }
    .c-loading-spinner { font-size: 28px; display: block; margin-bottom: 8px; animation: spin .8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Empty state ── */
    .c-empty { text-align: center; padding: 32px 16px; color: var(--sub); }
    .c-empty-icon { font-size: 32px; display: block; margin-bottom: 8px; }

    /* ── Sticky bottom nav ── */
    .c-bottom-nav {
      position: fixed; bottom: 0; left: 0; right: 0;
      background: var(--card); border-top: 1px solid var(--border);
      display: flex; z-index: 200; box-shadow: 0 -2px 10px rgba(0,0,0,.1);
    }
    .c-bot-btn {
      flex: 1; padding: 10px 4px; text-align: center;
      font-size: 11px; font-weight: 600; color: var(--sub);
      background: none; border: none; cursor: pointer; transition: color .15s;
    }
    .c-bot-btn.ativo { color: var(--verde); }
    .c-bot-btn span { display: block; font-size: 20px; margin-bottom: 2px; }

    /* ── Toast ── */
    .c-toast {
      position: fixed; top: 16px; left: 50%; transform: translateX(-50%);
      background: #1b4d2e; color: #fff; padding: 10px 20px;
      border-radius: 8px; font-size: 13px; font-weight: 600;
      z-index: 999; display: none; white-space: nowrap;
      box-shadow: 0 4px 16px rgba(0,0,0,.3);
    }
    .c-toast.erro { background: var(--danger); }

    /* ── Desktop link ── */
    .gestor-link {
      background: var(--verde-light); border: 1px solid #a7f3d0;
      border-radius: 10px; padding: 12px 16px; margin-bottom: 14px;
      display: flex; align-items: center; gap: 10px; text-decoration: none;
      color: var(--verde-dark);
    }
    .gestor-link-icon { font-size: 20px; }
    .gestor-link-text { font-size: 13px; font-weight: 600; }
    .gestor-link-sub { font-size: 11px; color: var(--sub); }

    /* Tamanhos mobile-friendly (touch target ≥44px, font ≥16px no iOS) — aba Pasto */
    #sec-pasto .c-field input,
    #sec-pasto .c-field select,
    #sec-pasto .c-field textarea { font-size: 16px; padding: 12px 14px; }
    #sec-pasto .btn-primary { padding: 14px; font-size: 16px; }

    /* Sub-tabs (dentro da aba Animais) */
    .c-subtabs {
      display: flex; gap: 6px;
      background: rgba(0,0,0,.04);
      padding: 4px; margin-bottom: 14px;
      border-radius: 10px;
    }
    .c-subtab {
      flex: 1; min-height: 44px; padding: 12px 8px;
      border: none; background: transparent; border-radius: 8px;
      font-size: 13px; font-weight: 600; color: var(--sub);
      cursor: pointer; white-space: nowrap;
      transition: background .15s, color .15s;
    }
    .c-subtab.ativo {
      background: var(--card); color: var(--verde-dark);
      box-shadow: 0 1px 2px rgba(0,0,0,.1);
    }
    .c-subsection { display: none; }
    .c-subsection.ativo { display: block; }

    /* Tamanhos mobile-friendly — aba Animais (mesmo padrão do #sec-pasto) */
    #sec-animais .c-field input,
    #sec-animais .c-field select,
    #sec-animais .c-field textarea { font-size: 16px; padding: 12px 14px; }
    #sec-animais .btn-primary { padding: 14px; font-size: 16px; }
  </style>
</head>
<body>

<!-- ── Topbar ── -->
<div class="c-top">
  <div class="c-top-left">
    <span class="c-top-icon">🐄</span>
    <div>
      <div class="c-top-title">Modo Campo</div>
      <div class="c-top-sub">{{ usuario_nome }}</div>
    </div>
  </div>
  <div class="c-top-right">
    {% if usuario_perfil == 'GESTOR' %}
    <a href="/dashboard" style="color:#fff;font-size:12px;text-decoration:none;opacity:.85;">🖥 Gestor</a>
    {% endif %}
    <button class="btn-logout" onclick="sair()">Sair</button>
  </div>
</div>

<!-- ── Nav tabs ── -->
<nav class="c-nav">
  <button class="c-tab ativo" id="tab-pasto" onclick="mudarTab('pasto')">
    <span class="c-tab-icon">🌿</span>Pasto
  </button>
  <button class="c-tab" id="tab-racao" onclick="mudarTab('racao')">
    <span class="c-tab-icon">🌾</span>Ração
  </button>
  <button class="c-tab" id="tab-conf" onclick="mudarTab('conf')">
    <span class="c-tab-icon">🏗️</span>Confinamento
  </button>
  <button class="c-tab" id="tab-animais" onclick="mudarTab('animais')">
    <span class="c-tab-icon">🐂</span>Animais
  </button>
</nav>

<!-- ── Toast ── -->
<div class="c-toast" id="cToast"></div>

<!-- ── PASTO ── -->
<section class="c-section ativo" id="sec-pasto">
  <div id="pasto-content">
    <div class="c-loading"><span class="c-loading-spinner">⏳</span>Carregando pasto...</div>
  </div>

  <!-- Formulário de medição -->
  <div class="c-card" style="margin-top:16px;">
    <div class="c-form-title">📏 Medir Pasto</div>
    <div class="c-field">
      <label>Piquete *</label>
      <select id="medPiqSel"><option value="">— selecione —</option></select>
    </div>
    <div class="c-field">
      <label>Altura (cm) *</label>
      <input type="number" id="medAltura" step="0.5" min="0" placeholder="ex: 28.5"/>
    </div>
    <div class="c-field">
      <label>Cobertura (%)</label>
      <input type="number" id="medCobertura" step="1" min="0" max="100" placeholder="ex: 85"/>
    </div>
    <div class="c-field">
      <label>Falhas (%)</label>
      <input type="number" id="medFalhas" step="1" min="0" max="100" placeholder="ex: 5"/>
    </div>
    <div class="c-field">
      <label>Data</label>
      <input type="date" id="medData"/>
    </div>
    <div class="c-field">
      <label>Responsável</label>
      <input type="text" id="medResp" placeholder="Campo"/>
    </div>
    <div class="c-field">
      <label>Observação</label>
      <textarea id="medObs" placeholder="opcional..."></textarea>
    </div>
    <button class="btn-primary" onclick="registrarMedicao()">💾 Salvar Medição</button>
  </div>
</section>

<!-- ── RAÇÃO ── -->
<section class="c-section" id="sec-racao">
  <div id="racao-content">
    <div class="c-loading"><span class="c-loading-spinner">⏳</span>Carregando ração...</div>
  </div>

  <!-- Formulário lançamento ração -->
  <div class="c-card" style="margin-top:16px;">
    <div class="c-form-title">➕ Registrar Lançamento</div>
    <div class="c-field">
      <label>Lote / Suplemento</label>
      <select id="racaoPlanoSel">
        <option value="">— selecione —</option>
      </select>
    </div>
    <div class="c-field">
      <label>Quantidade fornecida (kg)</label>
      <input type="number" id="racaoQtd" step="0.1" min="0" placeholder="ex: 125.0"/>
    </div>
    <div class="c-field">
      <label>Data</label>
      <input type="date" id="racaoData"/>
    </div>
    <div class="c-field">
      <label>Observação</label>
      <textarea id="racaoObs" placeholder="opcional..."></textarea>
    </div>
    <button class="btn-primary" onclick="registrarRacao()">💾 Salvar Lançamento</button>
  </div>
</section>

<!-- ── CONFINAMENTO ── -->
<section class="c-section" id="sec-conf">
  <div id="conf-content">
    <div class="c-loading"><span class="c-loading-spinner">⏳</span>Carregando confinamento...</div>
  </div>

  <!-- Formulário lançamento confinamento -->
  <div class="c-card" style="margin-top:16px;">
    <div class="c-form-title">➕ Fornecimento Confinamento</div>
    <div class="c-field">
      <label>Lote de Confinamento</label>
      <select id="confLoteSel">
        <option value="">— selecione —</option>
      </select>
    </div>
    <div class="c-field">
      <label>Quantidade fornecida (kg)</label>
      <input type="number" id="confQtd" step="0.1" min="0" placeholder="ex: 800.0"/>
    </div>
    <div class="c-field">
      <label>Data</label>
      <input type="date" id="confData"/>
    </div>
    <div class="c-field">
      <label>Responsável</label>
      <input type="text" id="confResp" placeholder="Nome do funcionário"/>
    </div>
    <button class="btn-primary" onclick="registrarConfinamento()">💾 Salvar Fornecimento</button>
  </div>
</section>

<!-- ── ANIMAIS (sub-tabs Pesar / Medicar / Morte) ── -->
<section class="c-section" id="sec-animais">
  <!-- Sub-tabs -->
  <div class="c-subtabs">
    <button class="c-subtab ativo" id="subtab-pesar"   onclick="mudarSubTab('pesar')">⚖️ Pesar</button>
    <button class="c-subtab"       id="subtab-medicar" onclick="mudarSubTab('medicar')">💉 Medicar</button>
    <button class="c-subtab"       id="subtab-morte"   onclick="mudarSubTab('morte')">⚠️ Morte</button>
  </div>

  <!-- Sub-section: Pesar (form intacto, IDs preservados) -->
  <div class="c-subsection ativo" id="sub-pesar">
    <div class="c-card">
      <div class="c-form-title">⚖️ Registrar Pesagem</div>
      <div class="c-field">
        <label>Brinco do Animal</label>
        <input type="text" id="pesBrinco" placeholder="ex: BOV-001" autocapitalize="characters"/>
      </div>
      <div class="c-field">
        <label>Peso (kg)</label>
        <input type="number" id="pesPeso" step="0.1" min="1" placeholder="ex: 420.5"/>
      </div>
      <div class="c-field">
        <label>Data</label>
        <input type="date" id="pesData"/>
      </div>
      <div class="c-field">
        <label>Responsável</label>
        <input type="text" id="pesResp" placeholder="Nome"/>
      </div>
      <div class="c-field">
        <label>Observação</label>
        <textarea id="pesObs" placeholder="opcional..."></textarea>
      </div>
      <button class="btn-primary" onclick="registrarPesagem()">💾 Salvar Pesagem</button>
    </div>

    <div id="pesagem-recente">
      <div class="c-loading"><span class="c-loading-spinner">⏳</span>Carregando...</div>
    </div>
  </div>

  <!-- Sub-section: Medicar (sanidade) -->
  <div class="c-subsection" id="sub-medicar">
    <div class="c-card">
      <div class="c-form-title">💉 Registrar Medicação</div>
      <div class="c-field">
        <label>Brinco do Animal *</label>
        <input type="text" id="sanBrinco" placeholder="ex: BOV-001" autocapitalize="characters"/>
      </div>
      <div class="c-field">
        <label>Classificação *</label>
        <select id="sanClass"><option value="">— selecione —</option></select>
      </div>
      <div class="c-field">
        <label>Medicamento / Produto *</label>
        <input type="text" id="sanMed" list="sanMedList" placeholder="Nome do produto"/>
        <datalist id="sanMedList"></datalist>
      </div>
      <div class="c-field">
        <label>Quantidade</label>
        <input type="number" id="sanQtd" step="0.1" min="0" placeholder="ex: 10"/>
      </div>
      <div class="c-field">
        <label>Unidade</label>
        <input type="text" id="sanUnidade" placeholder="ml, dose, comprimido..."/>
      </div>
      <div class="c-field">
        <label>Data *</label>
        <input type="date" id="sanData"/>
      </div>
      <div class="c-field">
        <label>Responsável</label>
        <input type="text" id="sanResp" placeholder="Campo"/>
      </div>
      <div class="c-field">
        <label>Observação</label>
        <textarea id="sanObs" placeholder="opcional..."></textarea>
      </div>
      <button class="btn-primary" onclick="registrarSanidade()">💾 Salvar</button>
    </div>
  </div>

  <!-- Sub-section: Morte (placeholder — conteúdo no commit 6) -->
  <div class="c-subsection" id="sub-morte">
    <div class="c-empty"><span class="c-empty-icon">⚠️</span>Em breve</div>
  </div>
</section>

<script>
const TAB_ORDER = ['pasto','racao','conf','animais'];
const SUB_TAB_ORDER = ['pesar','medicar','morte'];
let dadosCache = null;
let dadosPlanos = [];
let dadosConf = [];

// ── Navegação ─────────────────────────────────────────────────────────
function mudarTab(tab) {
  TAB_ORDER.forEach(t => {
    document.getElementById('tab-'+t).classList.toggle('ativo', t === tab);
    document.getElementById('sec-'+t).classList.toggle('ativo', t === tab);
  });
  if (!dadosCache) carregarDados();
}

function mudarSubTab(sub) {
  SUB_TAB_ORDER.forEach(s => {
    document.getElementById('subtab-'+s).classList.toggle('ativo', s === sub);
    document.getElementById('sub-'+s).classList.toggle('ativo', s === sub);
  });
}

// ── Toast ─────────────────────────────────────────────────────────────
function toast(msg, erro) {
  const el = document.getElementById('cToast');
  el.textContent = msg;
  el.className = 'c-toast' + (erro ? ' erro' : '');
  el.style.display = 'block';
  setTimeout(() => el.style.display = 'none', 3000);
}

// ── Logout ────────────────────────────────────────────────────────────
async function sair() {
  await fetch('/auth/logout', {method:'POST'});
  location.href = '/login';
}

// ── Carregar dados ────────────────────────────────────────────────────
async function carregarDados() {
  try {
    const r = await fetch('/campo/dados');
    if (r.status === 401) { location.href = '/login'; return; }
    dadosCache = await r.json();
    renderPasto(dadosCache.pastagem || []);
    renderConf(dadosCache.confinamento || []);
    renderPesagemResumo(dadosCache.pesagem || {});

    // Ração: fonte separada pra ter plano_id no select (POST /nutricao/lancamentos
    // exige plano_id; o /campo/dados não retorna o id).
    const planos = await fetch('/nutricao/planos?status=ATIVO')
      .then(rr => rr.ok ? rr.json() : [])
      .catch(() => []);
    const hoje = new Date().toISOString().slice(0,10);
    const vigentes = planos.filter(p =>
      p.data_inicio && p.data_inicio <= hoje && (!p.data_fim || p.data_fim >= hoje)
    );
    renderRacao(vigentes);

    // Pasto: lista de piquetes pra dropdown do form de medição.
    await carregarPiquetes();

    // Animais: definições para os forms de sanidade (e morte, no futuro).
    await carregarDefinicoesSanidade();
  } catch(e) {
    toast('Erro ao carregar dados', true);
  }
}

// ── PASTO ─────────────────────────────────────────────────────────────
function renderPasto(lista) {
  const el = document.getElementById('pasto-content');
  if (!lista.length) {
    el.innerHTML = '<div class="c-empty"><span class="c-empty-icon">🌿</span>Nenhum piquete cadastrado</div>';
    el.innerHTML += '<a href="/pastagem-page" class="gestor-link"><span class="gestor-link-icon">🌿</span><div><div class="gestor-link-text">Ver mapa completo</div><div class="gestor-link-sub">Acesso ao módulo de pastagem</div></div></a>';
    return;
  }
  const statusMap = {
    'DISPONIVEL': ['badge-ok','Disponível'],
    'OCUPADO':    ['badge-alerta','Ocupado'],
    'DESCANSO':   ['badge-alerta','Descanso'],
    'VEDADO':     ['badge-critico','Vedado'],
  };
  let html = '<div class="c-card"><div class="c-card-title">🌿 Piquetes</div>';
  lista.forEach(p => {
    const [badgeCls, badgeTxt] = statusMap[p.status] || ['badge-alerta', p.status||'—'];
    html += `<div class="c-row">
      <div>
        <div class="c-row-label" style="font-weight:600;color:#111;font-size:13px;">${p.piquete}</div>
        <div class="c-row-label">${p.area_ha ? p.area_ha+' ha' : '—'}</div>
      </div>
      <span class="badge ${badgeCls}">${badgeTxt}</span>
    </div>`;
  });
  html += '</div>';
  html += '<a href="/pastagem-page" class="gestor-link"><span class="gestor-link-icon">🌿</span><div><div class="gestor-link-text">Ver mapa completo</div><div class="gestor-link-sub">Acesso ao módulo de pastagem</div></div></a>';
  el.innerHTML = html;
}

// ── RAÇÃO ─────────────────────────────────────────────────────────────
function renderRacao(lista) {
  const el = document.getElementById('racao-content');
  dadosPlanos = lista;
  if (!lista.length) {
    el.innerHTML = '<div class="c-empty"><span class="c-empty-icon">🌾</span>Nenhum plano ativo hoje</div>';
  } else {
    let html = '<div class="c-card"><div class="c-card-title">🌾 Planos de Hoje</div>';
    lista.forEach(p => {
      const qtdKg = p.consumo_med_lote_dia_kg != null
        ? Number(p.consumo_med_lote_dia_kg).toFixed(1)
        : (p.consumo_med_g && p.qtd_animais ? ((p.consumo_med_g * p.qtd_animais) / 1000).toFixed(1) : '—');
      html += `<div class="c-row">
        <div>
          <div style="font-size:13px;font-weight:600;">${p.lote_nome}</div>
          <div class="c-row-label">${p.suplemento_nome} · ${p.qtd_animais} animais</div>
        </div>
        <div style="text-align:right;">
          <div style="font-size:13px;font-weight:700;color:var(--verde-dark);">${qtdKg} kg</div>
          <div class="c-row-label">previsto</div>
        </div>
      </div>`;
    });
    html += '</div>';
    el.innerHTML = html;
  }
  // Popular select do formulário (value = plano_id real)
  const sel = document.getElementById('racaoPlanoSel');
  sel.innerHTML = '<option value="">— selecione —</option>';
  lista.forEach(p => {
    sel.innerHTML += `<option value="${p.id}">${p.lote_nome} — ${p.suplemento_nome}</option>`;
  });
  // Setar data de hoje
  document.getElementById('racaoData').value = new Date().toISOString().slice(0,10);
}

// ── CONFINAMENTO ──────────────────────────────────────────────────────
function renderConf(lista) {
  const el = document.getElementById('conf-content');
  dadosConf = lista;
  if (!lista.length) {
    el.innerHTML = '<div class="c-empty"><span class="c-empty-icon">🏗️</span>Nenhum lote ativo</div>';
  } else {
    let html = '<div class="c-card"><div class="c-card-title">🏗️ Lotes Ativos</div>';
    lista.forEach(lc => {
      const badge = lc.lancou_hoje ? 'badge-sim' : 'badge-nao';
      const txt = lc.lancou_hoje ? '✓ Forneceu hoje' : '✗ Pendente hoje';
      html += `<div class="c-row">
        <div>
          <div style="font-size:13px;font-weight:600;">${lc.nome}</div>
          <div class="c-row-label">${lc.qtd_animais} animais</div>
        </div>
        <span class="badge ${badge}">${txt}</span>
      </div>`;
    });
    html += '</div>';
    el.innerHTML = html;
  }
  // Popular select do formulário
  const sel = document.getElementById('confLoteSel');
  sel.innerHTML = '<option value="">— selecione —</option>';
  lista.forEach(lc => {
    sel.innerHTML += `<option value="${lc.id}">${lc.nome} (${lc.qtd_animais} cab.)</option>`;
  });
  document.getElementById('confData').value = new Date().toISOString().slice(0,10);
}

// ── PESAGEM resumo ────────────────────────────────────────────────────

// ── PASTO (medição) ───────────────────────────────────────────────────
async function carregarPiquetes() {
  const lista = await fetch('/pastagem/piquetes')
    .then(r => r.ok ? r.json() : [])
    .catch(() => []);
  const sel = document.getElementById('medPiqSel');
  sel.innerHTML = '<option value="">— selecione —</option>';
  lista.forEach(p => {
    sel.innerHTML += `<option value="${p.id}">${p.nome}</option>`;
  });
  document.getElementById('medData').value = new Date().toISOString().slice(0,10);
}

async function registrarMedicao() {
  const piquete_id = parseInt(document.getElementById('medPiqSel').value);
  const altura_cm  = parseFloat(document.getElementById('medAltura').value);
  const cobertura  = document.getElementById('medCobertura').value;
  const falhas     = document.getElementById('medFalhas').value;
  const data       = document.getElementById('medData').value;
  const resp       = document.getElementById('medResp').value.trim();
  const obs        = document.getElementById('medObs').value.trim();
  if (!piquete_id || isNaN(altura_cm) || altura_cm < 0) {
    toast('Selecione piquete e informe altura', true); return;
  }
  if (!data) { toast('Informe a data', true); return; }
  try {
    const r = await fetch('/pastagem/medicoes', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({
        piquete_id, altura_cm,
        cobertura_pct: cobertura !== '' ? parseFloat(cobertura) : null,
        falhas_pct:    falhas    !== '' ? parseFloat(falhas)    : null,
        data,
        responsavel:   resp || 'Campo',
        obs:           obs  || null,
      })
    });
    if (!r.ok) {
      const e = await r.json().catch(() => ({}));
      toast(e.detail || 'Erro ao salvar', true);
      return;
    }
    toast('✓ Medição salva!', false);
    document.getElementById('medAltura').value = '';
    document.getElementById('medCobertura').value = '';
    document.getElementById('medFalhas').value = '';
    document.getElementById('medObs').value = '';
    dadosCache = null; carregarDados();
  } catch {
    toast('Erro de conexão', true);
  }
}

// ── Registrar ração ───────────────────────────────────────────────────
async function registrarRacao() {
  const planoId = parseInt(document.getElementById('racaoPlanoSel').value);
  const qtd = parseFloat(document.getElementById('racaoQtd').value);
  const data = document.getElementById('racaoData').value;
  const obs = document.getElementById('racaoObs').value;
  if (!planoId || !data || isNaN(qtd) || qtd <= 0) { toast('Preencha todos os campos', true); return; }
  try {
    const r = await fetch('/nutricao/lancamentos', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({
        plano_id: planoId,
        data,
        qtd_fornecida_kg: qtd,
        responsavel: 'Campo',
        obs: obs.trim() || null,
      })
    });
    if (!r.ok) {
      const e = await r.json().catch(() => ({}));
      toast(e.detail || 'Erro ao salvar', true);
      return;
    }
    toast('✓ Lançamento registrado!', false);
    document.getElementById('racaoQtd').value = '';
    document.getElementById('racaoObs').value = '';
    dadosCache = null; carregarDados();
  } catch {
    toast('Erro de conexão', true);
  }
}

// ── Registrar fornecimento confinamento ───────────────────────────────
async function registrarConfinamento() {
  const loteId = document.getElementById('confLoteSel').value;
  const qtd = parseFloat(document.getElementById('confQtd').value);
  const data = document.getElementById('confData').value;
  const resp = document.getElementById('confResp').value.trim();
  if (!loteId || isNaN(qtd) || qtd <= 0 || !data) { toast('Preencha todos os campos', true); return; }
  try {
    // Resolver fase_id real: backend nao filtra por status, entao pegamos
    // todas as fases do lote e filtramos no JS pela ATIVA.
    const fases = await fetch('/confinamento/lotes/'+loteId+'/fases')
      .then(rr => rr.ok ? rr.json() : [])
      .catch(() => []);
    const ativa = (fases || []).find(f => f.status === 'ATIVA');
    if (!ativa) { toast('Lote sem fase ativa', true); return; }
    const r = await fetch('/confinamento/lancamentos', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({
        lote_conf_id: parseInt(loteId),
        fase_id: ativa.id,
        data, qtd_fornecida_kg: qtd,
        responsavel: resp || 'Campo'
      })
    });
    if (!r.ok) {
      const e = await r.json().catch(() => ({}));
      toast(e.detail || 'Erro ao registrar', true);
      return;
    }
    toast('✓ Fornecimento registrado!', false);
    document.getElementById('confQtd').value = '';
    document.getElementById('confResp').value = '';
    dadosCache = null; carregarDados();
  } catch {
    toast('Erro de conexão', true);
  }
}

// ── Registrar pesagem ─────────────────────────────────────────────────
async function registrarPesagem() {
  const brinco = document.getElementById('pesBrinco').value.trim().toUpperCase();
  const peso = parseFloat(document.getElementById('pesPeso').value);
  const data = document.getElementById('pesData').value;
  const resp = document.getElementById('pesResp').value.trim();
  const obs = document.getElementById('pesObs').value;
  if (!brinco || isNaN(peso) || peso <= 0 || !data) { toast('Preencha brinco, peso e data', true); return; }
  try {
    const r = await fetch('/pesagens/', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({brinco, peso_kg: peso, data, responsavel: resp||'Campo', obs})
    });
    if (!r.ok) {
      const err = await r.json();
      toast(err.detail||'Erro ao salvar', true); return;
    }
    toast('✓ Pesagem registrada!', false);
    document.getElementById('pesBrinco').value = '';
    document.getElementById('pesPeso').value = '';
    document.getElementById('pesObs').value = '';
    dadosCache = null; carregarDados();
  } catch { toast('Erro ao registrar', true); }
}

// ── ANIMAIS / Sanidade (sub-tab Medicar) ──────────────────────────────
async function carregarDefinicoesSanidade() {
  try {
    const defs = await fetch('/definicoes')
      .then(r => r.ok ? r.json() : null)
      .catch(() => null);
    if (!defs) return;
    const sel = document.getElementById('sanClass');
    if (sel) {
      sel.innerHTML = '<option value="">— selecione —</option>';
      (defs.classificacoes_sanidade || []).forEach(c => {
        sel.innerHTML += `<option value="${c}">${c}</option>`;
      });
    }
    const dl = document.getElementById('sanMedList');
    if (dl) {
      dl.innerHTML = (defs.medicamentos || []).map(m => `<option value="${m}">`).join('');
    }
  } catch {} // silencioso — dropdown vazio é aceitável
  document.getElementById('sanData').value = new Date().toISOString().slice(0,10);
}

async function registrarSanidade() {
  const brinco = document.getElementById('sanBrinco').value.trim().toUpperCase();
  const classificacao = document.getElementById('sanClass').value;
  const medicamento = document.getElementById('sanMed').value.trim();
  const quantidade = document.getElementById('sanQtd').value;
  const unidade = document.getElementById('sanUnidade').value.trim();
  const data = document.getElementById('sanData').value;
  const resp = document.getElementById('sanResp').value.trim();
  const obs = document.getElementById('sanObs').value.trim();
  if (!brinco) { toast('Informe o brinco', true); return; }
  if (!classificacao) { toast('Selecione a classificação', true); return; }
  if (!medicamento) { toast('Informe o medicamento', true); return; }
  if (!data) { toast('Informe a data', true); return; }
  try {
    const r = await fetch('/sanidade', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({
        brinco,
        data,
        classificacao,
        medicamento,
        quantidade:  quantidade !== '' ? parseFloat(quantidade) : null,
        unidade:     unidade || null,
        responsavel: resp || 'Campo',
        obs:         obs || null,
        status:      'APLICADO',
      })
    });
    if (!r.ok) {
      const e = await r.json().catch(() => ({}));
      toast(e.detail || 'Erro ao salvar', true);
      return;
    }
    toast('✓ Medicação registrada!', false);
    // Mantém brinco — vaqueiro pode lançar várias medicações no mesmo animal.
    document.getElementById('sanMed').value = '';
    document.getElementById('sanQtd').value = '';
    document.getElementById('sanUnidade').value = '';
    document.getElementById('sanObs').value = '';
    dadosCache = null; carregarDados();
  } catch {
    toast('Erro de conexão', true);
  }
}

// ── Inicialização ─────────────────────────────────────────────────────
carregarDados();
</script>
